<!DOCTYPE html>
<html lang="fr">
<head>
<script>
window.onerror = function(msg, url, line, col, err) {
  document.documentElement.insertAdjacentHTML("afterbegin",
    '<div style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#c81e2c;color:#fff;' +
    'padding:14px;font-size:12px;word-break:break-word;font-family:monospace;">' +
    'ERREUR JS : ' + msg + ' (ligne ' + line + ')</div>');
  return false;
};
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taxi Wal — Admin</title>
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#f7f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taxi Wal Admin">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    color-scheme:light;
    --noir:#f7f7f5; --noir-2:#ffffff; --rouge:#c81e2c; --vert:#1f8a4c;
    --gris:#6b6b6b; --blanc:#1c1c1c; --bleu:#3b82c4;
  }
  *{box-sizing:border-box;}
  body{ margin:0;
    background:
      linear-gradient(rgba(255,255,255,.90), rgba(255,255,255,.94)),
      url('fond-flotte.jpg') center/cover no-repeat fixed;
    color:var(--blanc);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:60px; }
  header{ padding:calc(20px + env(safe-area-inset-top)) 20px 20px; border-bottom:1px solid #dcdcda; position:sticky; top:0; background:rgba(255,255,255,.85); backdrop-filter:blur(6px); z-index:10; }
  header h1{ margin:0; font-size:1.1rem; }
  @keyframes logo-pulse{
    0%,100%{ transform:scale(1); filter:drop-shadow(0 0 0 rgba(200,30,44,0)); }
    50%{ transform:scale(1.06); filter:drop-shadow(0 0 10px rgba(200,30,44,.55)); }
  }
  header img{ animation:logo-pulse 3.5s ease-in-out infinite; }
  nav{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-top:14px; }
  nav button{ padding:16px 8px; border-radius:12px; border:1px solid #cfcfcd; background:var(--noir-2); color:var(--gris); font-size:.95rem; font-weight:600; cursor:pointer; }
  nav button.actif{ background:var(--rouge); color:#fff; border-color:var(--rouge); }

  section{ display:none; padding:20px; }
  section.visible{ display:block; }

  /* Agenda / calendrier */
  .calendrier{ background:var(--noir-2); border-radius:12px; padding:14px; margin-bottom:16px; }
  .cal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .cal-header button{ width:auto; padding:6px 14px; background:var(--noir); border:1px solid #cfcfcd; border-radius:8px; color:var(--blanc); cursor:pointer; }
  .cal-header span{ font-weight:600; text-transform:capitalize; }
  .cal-grille{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-jour-nom{ font-size:.7rem; color:var(--gris); padding:4px 0; }
  .cal-jour{ position:relative; padding:9px 0; border-radius:8px; font-size:.85rem; cursor:pointer; background:var(--noir); }
  .cal-jour.hors-mois{ visibility:hidden; }
  .cal-jour.aujourdhui{ border:1px solid var(--vert); }
  .cal-jour.selectionne{ background:var(--rouge); color:#fff; }
  .cal-jour .point{ position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:var(--vert); }
  .cal-jour.selectionne .point{ background:#fff; }
  #agenda-jour-titre{ color:var(--gris); font-size:.9rem; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
  #btn-ajouter-jour{ width:auto; padding:8px 12px; font-size:.8rem; background:var(--vert); border:none; border-radius:8px; color:#fff; cursor:pointer; }

  /* Onglet courses */
  #btn-nouvelle-course{ width:100%; padding:14px; border-radius:10px; border:none; background:var(--vert); color:#fff; font-weight:600; margin-bottom:16px; cursor:pointer; }
  .course{ background:var(--noir-2); border-radius:12px; padding:16px; margin-bottom:12px; border-left:4px solid var(--gris); }
  .course.assignee{ border-left-color:var(--bleu); }
  .course.prix_envoye{ border-left-color:#c8961e; }
  .course.attente_acompte{ border-left-color:#c8961e; }
  .course.acompte_declare{ border-left-color:#3b82c4; }
  .course.confirmee{ border-left-color:var(--vert); }
  .course.en_cours{ border-left-color:var(--rouge); }
  .course.terminee{ border-left-color:var(--vert); }
  .course.annulee{ border-left-color:#c7c7c5; opacity:.5; }
  .course h3{ margin:0 0 4px; font-size:1rem; }
  .course .heure{ color:var(--gris); font-size:.85rem; margin-bottom:8px; }
  .course .trajet{ font-size:.9rem; line-height:1.5; margin-bottom:10px; }
  .course select{ width:100%; padding:10px; border-radius:8px; background:#f7f7f5; color:var(--blanc); border:1px solid #cfcfcd; margin-bottom:8px; }
  .course .ligne-actions{ display:flex; gap:8px; }
  .course .ligne-actions button{ flex:1; padding:9px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); font-size:.85rem; cursor:pointer; }
  .statut-label{ display:inline-block; font-size:.75rem; padding:3px 10px; border-radius:20px; background:#dcdcda; color:var(--gris); margin-bottom:8px; }
  .badge-ar{ display:inline-block; font-size:.75rem; padding:3px 10px; border-radius:20px; background:#fde3cc; color:#8a4a00; margin-bottom:8px; margin-left:6px; font-weight:600; }

  .bloc-prix-admin{ display:flex; gap:8px; margin-bottom:8px; }
  .bloc-prix-admin input{ flex:1; padding:10px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); }
  .bloc-prix-admin button{ width:auto; padding:10px 14px; font-size:.85rem; background:var(--vert); border:none; border-radius:8px; color:#fff; cursor:pointer; }
  .alerte-acompte{ background:rgba(59,130,196,.15); border:1px solid var(--bleu); border-radius:8px; padding:10px; margin-bottom:8px; font-size:.85rem; }
  .alerte-acompte button{ width:100%; margin-top:8px; padding:10px; border:none; border-radius:8px; background:var(--vert); color:#fff; font-weight:600; cursor:pointer; }

  .form-modif-course{ background:#f7f7f5; border-radius:10px; padding:12px; margin-top:8px; }
  .form-modif-course label{ display:block; font-size:.75rem; color:var(--gris); margin:8px 0 3px; }
  .form-modif-course input, .form-modif-course textarea, .form-modif-course select{ width:100%; padding:9px; border-radius:8px; border:1px solid #cfcfcd; background:var(--noir-2); color:var(--blanc); font-size:.85rem; }
  .form-modif-course textarea{ resize:vertical; min-height:44px; }
  .form-modif-course .ligne-checkbox{ display:flex; align-items:center; gap:8px; margin:10px 0 0; }
  .form-modif-course .ligne-checkbox input{ width:auto; }
  .form-modif-course .ligne-checkbox label{ margin:0; }
  .form-modif-course .ligne-surprime{ display:flex; gap:8px; align-items:center; }
  .form-modif-course .ligne-surprime input{ flex:1; }
  .form-modif-course .btn-suppr-surprime{ width:auto; padding:9px 12px; border-radius:8px; border:1px solid var(--rouge); background:transparent; color:var(--rouge); font-size:.85rem; cursor:pointer; }
  .form-modif-course .btn-enregistrer-modif{ width:100%; margin-top:12px; padding:11px; border:none; border-radius:8px; background:var(--vert); color:#fff; font-weight:600; cursor:pointer; }
  .form-modif-course .btn-supprimer-course{ width:100%; margin-top:8px; padding:11px; border:1px solid var(--rouge); border-radius:8px; background:transparent; color:var(--rouge); font-weight:600; cursor:pointer; }

  /* Carte */
  #carte{ height:45vh; border-radius:12px; }
  #carte-liste-chauffeurs{ margin-top:14px; }
  .cc-chauffeur{ background:var(--noir-2); border-radius:12px; padding:12px 14px; margin-bottom:10px; border-left:4px solid var(--gris); font-size:.9rem; }
  .cc-chauffeur.cc-dispo{ border-left-color:var(--vert); }
  .cc-chauffeur.cc-course{ border-left-color:var(--rouge); }
  .cc-chauffeur h4{ margin:0 0 6px; font-size:.95rem; }
  .cc-chauffeur .cc-ligne{ color:var(--gris); font-size:.82rem; margin-top:2px; }
  .cc-chauffeur .cc-ligne b{ color:var(--blanc); }

  #outil-calcul{ background:var(--noir-2); border-radius:12px; padding:16px; margin-top:18px; }
  #outil-calcul h3{ margin:0 0 4px; font-size:.95rem; }
  #outil-calcul p{ margin:0 0 12px; color:var(--gris); font-size:.8rem; }
  #outil-calcul label{ display:block; font-size:.78rem; color:var(--gris); margin:8px 0 4px; }
  #outil-calcul select, #outil-calcul input{ width:100%; padding:10px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); font-size:.9rem; }
  #btn-calculer-trajet{ width:100%; padding:12px; border-radius:8px; border:none; background:var(--vert); color:#fff; font-weight:600; margin-top:12px; cursor:pointer; }
  #calc-resultat{ margin-top:12px; font-size:.9rem; padding:10px; border-radius:8px; background:#f7f7f5; display:none; }
  #calc-resultat.visible{ display:block; }
  #calc-adresse-centrale-bloc{ margin-top:14px; padding-top:12px; border-top:1px solid #dcdcda; }

  /* Caisse */
  .caisse-chauffeur{ background:var(--noir-2); border-radius:12px; padding:16px; margin-bottom:12px; }
  .caisse-chauffeur h3{ margin:0 0 10px; font-size:1rem; }
  .caisse-ligne{ display:flex; justify-content:space-between; font-size:.9rem; margin-bottom:6px; color:var(--gris); }
  .caisse-ligne b{ color:var(--blanc); }
  .caisse-total{ font-size:1.1rem; font-weight:700; margin-top:10px; padding-top:10px; border-top:1px solid #dcdcda; display:flex; justify-content:space-between; }
  .caisse-fond{ display:flex; gap:8px; margin-top:12px; align-items:center; }
  .caisse-fond input{ flex:1; padding:10px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); }
  .caisse-fond button{ width:auto; padding:10px 14px; font-size:.85rem; }

  /* Feuilles de route (admin) */
  #feuilles-sous-onglets{ display:flex; gap:8px; margin-bottom:14px; }
  #feuilles-sous-onglets button{ width:auto; padding:9px 14px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); font-size:.85rem; cursor:pointer; }
  #feuilles-sous-onglets button.actif{ background:var(--rouge); color:#fff; border-color:var(--rouge); }
  #feuilles-date-nav{ display:flex; gap:8px; align-items:center; margin-bottom:16px; }
  #feuilles-date-nav input[type="date"]{ flex:1; padding:10px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); }
  #feuilles-date-nav button{ width:auto; padding:10px 12px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); cursor:pointer; font-size:.85rem; }
  #vue-historique-fa{ display:none; }
  #vue-historique-fa select{ width:100%; padding:12px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); font-size:.95rem; margin-bottom:14px; }
  .ligne-historique-fa{ display:flex; justify-content:space-between; align-items:center; background:var(--noir-2); border-radius:10px; padding:12px 14px; margin-bottom:8px; border-left:4px solid var(--gris); cursor:pointer; }
  .ligne-historique-fa.signee-fa{ border-left-color:var(--vert); }
  .ligne-historique-fa .lh-date{ font-weight:600; font-size:.9rem; }
  .ligne-historique-fa .lh-sous{ color:var(--gris); font-size:.78rem; margin-top:2px; }
  .ligne-historique-fa .lh-fleche{ color:var(--gris); }
  .feuille-admin{ background:var(--noir-2); border-radius:12px; padding:16px; margin-bottom:14px; border-left:4px solid var(--gris); }
  .feuille-admin.verrouillee-fa{ border-left-color:var(--vert); }
  .feuille-admin h3{ margin:0 0 4px; font-size:1rem; }
  .feuille-admin .sous{ color:var(--gris); font-size:.82rem; margin-bottom:10px; }
  .feuille-admin .entete-fa-titre{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .feuille-admin .entete-fa-actions{ display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; }
  .feuille-admin .btn-nouvelle-course-fa{ width:auto; padding:8px 12px; border-radius:8px; border:none; background:var(--vert); color:#fff; font-size:.8rem; cursor:pointer; }
  .feuille-admin .btn-details-fa{ width:auto; padding:8px 12px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); font-size:.8rem; cursor:pointer; font-weight:600; }
  .feuille-admin .btn-imprimer-fa{ width:auto; padding:8px 12px; border-radius:8px; border:1px solid var(--bleu); background:transparent; color:var(--bleu); font-size:.8rem; cursor:pointer; }
  .feuille-admin .identite-exploitant{ font-size:.75rem; color:var(--gris); margin-bottom:6px; }
  .feuille-admin .grille3-fa{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0; margin-bottom:8px; border:1px solid #cfcfcd; border-radius:6px; overflow:hidden; }
  .feuille-admin .grille3-fa > div{ padding:6px 8px; border-right:1px solid #dcdcda; }
  .feuille-admin .grille3-fa > div:last-child{ border-right:none; }
  .feuille-admin .grille3-fa input{ border:1px solid #dcdcda; }
  .feuille-admin label{ display:block; font-size:.72rem; color:var(--gris); margin-bottom:3px; }
  .feuille-admin input{ width:100%; padding:9px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); font-size:.85rem; }
  .feuille-admin .mini-titre{ font-size:.7rem; color:var(--gris); text-transform:uppercase; margin:10px 0 4px; }
  .feuille-admin .bloc-service-fa{ margin-bottom:10px; }
  .feuille-admin .bloc-service-fa .sous-titre-fa{ font-size:.68rem; color:var(--gris); text-transform:uppercase; margin:8px 0 4px; }
  .feuille-admin .total-fa{ font-size:.72rem; color:var(--vert); font-weight:700; margin-top:2px; }
  .feuille-admin .btn-verrou{ width:auto; padding:8px 12px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); font-size:.8rem; cursor:pointer; flex-shrink:0; }
  .ligne-admin{ background:#f0f1ee; border-radius:10px; padding:10px; margin-bottom:8px; border:1px solid #dcdcda; }
  .ligne-admin .num-ligne{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; cursor:pointer; gap:8px; }
  .ligne-admin .num-ligne span{ color:var(--blanc); font-size:.82rem; flex:1; }
  .ligne-admin .num-ligne .chevron-ligne{ color:var(--gris); font-size:.75rem; margin-left:6px; flex-shrink:0; }
  .ligne-admin .num-ligne button{ width:auto; padding:5px 10px; font-size:.72rem; border-radius:6px; border:1px solid #cfcfcd; background:#fbe2e2; color:#b83232; cursor:pointer; flex-shrink:0; }
  .ligne-admin .grille3-fa > div{ margin-bottom:6px; }
  #btn-ajouter-ligne-admin{ width:100%; padding:10px; border-radius:8px; border:1px dashed #c7c7c5; background:transparent; color:var(--blanc); font-size:.85rem; margin-top:4px; cursor:pointer; }
  #feuilles-vide{ color:var(--gris); text-align:center; padding:30px 0; }

  /* Véhicules (admin) */
  #btn-ajouter-vehicule{ width:100%; padding:14px; border-radius:10px; border:none; background:var(--vert); color:#fff; font-weight:600; margin-bottom:16px; cursor:pointer; }
  .vehicule-admin{ background:var(--noir-2); border-radius:12px; padding:16px; margin-bottom:12px; border-left:4px solid var(--gris); }
  .vehicule-admin.inactif{ opacity:.55; border-left-color:#c8961e; }
  .vehicule-admin .grille2-veh{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .vehicule-admin label{ display:block; font-size:.72rem; color:var(--gris); margin-bottom:3px; }
  .vehicule-admin input, .vehicule-admin select{ width:100%; padding:9px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); font-size:.85rem; }
  .vehicule-admin .ligne-actions-veh{ display:flex; gap:8px; margin-top:10px; }
  .vehicule-admin .ligne-actions-veh button{ flex:1; padding:9px; border-radius:8px; border:1px solid #cfcfcd; background:#f7f7f5; color:var(--blanc); font-size:.82rem; cursor:pointer; }
  .vehicule-admin .btn-suppr-veh{ border-color:var(--rouge); color:var(--rouge); }
  .vehicule-admin .btn-actif-veh.actif{ border-color:var(--vert); color:var(--vert); }

  /* Modale nouvelle course */
  #modale{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:50; align-items:flex-end; }
  #modale.visible{ display:flex; }
  #modale-contenu{ background:var(--noir-2); width:100%; border-radius:16px 16px 0 0; padding:20px; max-height:90vh; overflow-y:auto; }
  #modale-contenu h2{ margin-top:0; font-size:1.1rem; }
  #modale-contenu label{ display:block; font-size:.8rem; color:var(--gris); margin:10px 0 4px; }
  #modale-contenu input, #modale-contenu select, #modale-contenu textarea{
    width:100%; padding:12px; border-radius:8px; border:1px solid #cfcfcd; background:var(--noir); color:var(--blanc); font-size:.95rem;
  }
  #modale-contenu textarea{ resize:vertical; min-height:50px; }
  .liste-suggestions-adresse{ display:none; background:var(--noir-2); border:1px solid #cfcfcd; border-top:none; border-radius:0 0 8px 8px; max-height:180px; overflow-y:auto; margin-top:-10px; margin-bottom:8px; }
  .suggestion-adresse{ padding:10px 12px; font-size:.85rem; border-bottom:1px solid #eee; cursor:pointer; color:var(--blanc); }
  .suggestion-adresse:last-child{ border-bottom:none; }
  .suggestion-adresse:active{ background:#f0f1ee; }
  .suggestion-adresse .puce-recente{ color:var(--vert); font-size:.75rem; margin-right:4px; }
  #ligne-aller-retour{ display:flex; align-items:center; gap:8px; margin-top:14px; }
  #ligne-aller-retour input{ width:auto; }
  #ligne-aller-retour label{ margin:0; color:var(--blanc); font-size:.95rem; }
  #bloc-type-retour{ display:none; }
  #modale-actions{ display:flex; gap:10px; margin-top:18px; }
  #modale-actions button{ flex:1; padding:13px; border-radius:10px; border:none; font-weight:600; cursor:pointer; }
  #btn-annuler-modale{ background:#dcdcda; color:var(--blanc); }
  #btn-creer-course{ background:var(--rouge); color:#fff; }
  #erreur-modale{ color:var(--rouge); font-size:.85rem; margin-top:8px; min-height:1em; }

  /* Écran de connexion admin */
  #ecran-login-admin{ padding:60px 20px; max-width:360px; margin:0 auto; }
  #ecran-login-admin label{ display:block; font-size:.85rem; color:var(--gris); margin-bottom:6px; }
  #ecran-login-admin input{
    width:100%; padding:14px; margin-bottom:14px; border-radius:10px;
    border:1px solid #cfcfcd; background:var(--noir-2); color:var(--blanc); font-size:1rem;
  }
  #ecran-login-admin button{
    width:100%; padding:14px; border-radius:10px; border:none;
    background:var(--rouge); color:#fff; font-size:1rem; font-weight:600; cursor:pointer;
  }
  #ecran-login-admin button.secondaire{ background:var(--noir-2); border:1px solid #cfcfcd; margin-top:10px; }
  #erreur-login-admin{ color:var(--rouge); font-size:.85rem; margin-top:8px; min-height:1em; }
</style>
</head>
<body>

<div id="ecran-login-admin">
  <img src="icon-192.png" alt="Taxi Wal" style="width:64px; height:64px; border-radius:16px; display:block; margin:0 auto 14px; animation:logo-pulse 3.5s ease-in-out infinite;">
  <h1 style="text-align:center; font-size:1.2rem;">Taxi Wal — Admin</h1>
  <label for="email-admin">Adresse email administrateur</label>
  <input type="email" id="email-admin" placeholder="ton.email@exemple.com" autocomplete="email">
  <div id="bloc-otp-admin" style="display:none;">
    <label for="otp-admin">Code reçu par email</label>
    <input type="text" id="otp-admin" inputmode="numeric" placeholder="123456">
  </div>
  <button id="btn-envoyer-code-admin">Recevoir un code</button>
  <button id="btn-valider-code-admin" class="secondaire" style="display:none;">Se connecter</button>
  <p id="erreur-login-admin"></p>
</div>

<div id="app-admin" style="display:none;">

<header>
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:6px; position:relative;">
    <img src="icon-192.png" alt="Taxi Wal" style="width:40px; height:40px; border-radius:10px; flex-shrink:0;">

// Échappe tout texte avant de l'insérer dans du HTML — empêche qu'un nom, une adresse
// ou une note tapée par un client ou un chauffeur ne soit interprétée comme du code
// (protection contre l'injection de script / XSS), y compris dans les fenêtres d'impression.
function versDatetimeLocal(dateStr) {
  // Convertit une date ISO (UTC, telle que stockée en base) vers le format
  // "YYYY-MM-DDTHH:mm" attendu par un champ <input type="datetime-local">,
  // en tenant compte du fuseau horaire local (sinon l'heure affichée est décalée).
  if (!dateStr) return "";
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return "";
  const decalageMs = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - decalageMs).toISOString().slice(0, 16);
}

function esc(valeur) {
  if (valeur === null || valeur === undefined) return "";
  return String(valeur)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

const VAPID_PUBLIC_KEY = "BKmh8bflfEHbDKreLbxYj0GBmw0TVYhNyN0N1YzYO5SdKoVlj2Q3MJJN3KR5EbTifJNQf-2WB2VeevO60nzurGg";
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}
async function activerNotificationsPushReelles() {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
    if (Notification.permission !== "granted") {
      const resultat = await Notification.requestPermission();
      if (resultat !== "granted") return;
    }
    const registration = await navigator.serviceWorker.ready;
    let subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return;
    const json = subscription.toJSON();
    await supabase.from("push_subscriptions").upsert({
      user_id: user.id,
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth
    }, { onConflict: "endpoint" });
  } catch (e) { console.error("Abonnement notifications push impossible :", e); }
}

function jouerSonAlerteAdmin() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Sonnerie façon "appel téléphonique" : deux tonalités alternées, fortes, répétées plusieurs fois
    const frequences = [988, 1319]; // la-do aigu, comme une sonnerie classique
    const nbSonneries = 4;
    const dureeNote = 0.35;
    const pauseEntreNotes = 0.12;
    const pauseEntreSonneries = 0.5;
    let t = ctx.currentTime;

    for (let s = 0; s < nbSonneries; s++) {
      frequences.forEach(freq => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "square"; // son plus perçant qu'une sinusoïde, se remarque mieux
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.9, t + 0.02); // volume fort
        gain.gain.setValueAtTime(0.9, t + dureeNote - 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dureeNote);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dureeNote);
        t += dureeNote + pauseEntreNotes;
      });
      t += pauseEntreSonneries;
    }
  } catch (e) { console.error("Son impossible :", e); }

  if ("vibrate" in navigator) {
    try { navigator.vibrate([400, 200, 400, 200, 400, 200, 400]); } catch (e) {}
  }
}

    idsCoursesConnusAdmin = new Map((courses || []).map(c => [c.id, { statut: c.statut, accepte: c.accepte_chauffeur }]));
  } else {
    (courses || []).forEach(c => {
      const ancien = idsCoursesConnusAdmin.get(c.id);
      if (ancien === undefined && c.origine === "client") {
        notifierNouvelleCourseAdmin(c);
      } else if (ancien) {
        if (ancien.statut !== "acompte_declare" && c.statut === "acompte_declare") {
          notifierNouvelleCourseAdmin({ ...c, adresse_depart: "💰 Acompte déclaré payé", adresse_arrivee: c.adresse_arrivee });
        }
        if (!ancien.accepte && c.accepte_chauffeur) {
          notifierNouvelleCourseAdmin({ ...c, adresse_depart: "✅ Course acceptée par le chauffeur", adresse_arrivee: c.adresse_arrivee });
        }
        if (ancien.statut === "assignee" && c.statut === "en_cours") {
          notifierNouvelleCourseAdmin({ ...c, adresse_depart: "🚕 Chauffeur en route pour", adresse_arrivee: c.adresse_arrivee });
        }
        if (ancien.statut !== "terminee" && c.statut === "terminee") {
          notifierNouvelleCourseAdmin({ ...c, adresse_depart: `✅ ${nomChauffeurPourNotif(c)} a clôturé une course`, adresse_arrivee: `${c.adresse_depart} → ${c.adresse_arrivee}` });
        }
      }
      idsCoursesConnusAdmin.set(c.id, { statut: c.statut, accepte: c.accepte_chauffeur });
    });
  }

  dernieresCoursesAdmin = courses || [];

  verifierRappels30MinAdmin(dernieresCoursesAdmin);

  // Pendant un rafraîchissement automatique, ne jamais reconstruire la liste si l'admin est
  // en train de saisir un champ (modification d'une course) : sinon le formulaire se ferme
  // tout seul sous ses doigts avant qu'il ait fini de taper.
  const zoneCourses = document.getElementById("liste-courses-admin");
  const enTrainDeSaisir = depuisAutoRafraichissement && zoneCourses.contains(document.activeElement) && document.activeElement.tagName !== "BODY";
  if (!enTrainDeSaisir) {
    afficherListeCoursesAdmin();
  }

  if (document.getElementById("section-agenda").classList.contains("visible")) {
    rendreCalendrierAdmin();
  }
}

// ---------- RAPPEL 30 MINUTES AVANT CHAQUE COURSE ----------
const rappelsEnvoyesAdmin = new Set(); // ids de courses déjà rappelées, pour ne prévenir qu'une fois
function verifierRappels30MinAdmin(courses) {
  const maintenant = Date.now();
  (courses || []).forEach(c => {
    if (["terminee", "annulee"].includes(c.statut)) return;
    if (rappelsEnvoyesAdmin.has(c.id)) return;
    const minutesRestantes = (new Date(c.date_heure).getTime() - maintenant) / 60000;
    if (minutesRestantes > 0 && minutesRestantes <= 30) {
      rappelsEnvoyesAdmin.add(c.id);
      notifierNouvelleCourseAdmin({
        id: "rappel-" + c.id,
        adresse_depart: `⏰ Rappel : course dans ~30 min — ${c.client_nom || "Client"}`,
        adresse_arrivee: `${c.adresse_depart} → ${c.adresse_arrivee}`
      });
    }
  });
}

// ---------- LIEN WHATSAPP PRÉ-REMPLI POUR PRÉVENIR UN CHAUFFEUR ----------
function numeroWhatsapp(telephone) {
  if (!telephone) return null;
  let n = telephone.replace(/[^\d+]/g, "");
  if (n.startsWith("+")) n = n.slice(1);
  else if (n.startsWith("0")) n = "32" + n.slice(1); // Belgique par défaut
  return n;
}

function lienWhatsappCourse(course) {
  const chauffeur = chauffeursCache.find(c => c.id === course.chauffeur_id);
  const numero = chauffeur ? numeroWhatsapp(chauffeur.telephone) : null;
  if (!numero) return null;

  const heure = new Date(course.date_heure).toLocaleString("fr-BE", {
    weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
  });
  const texte = `Nouvelle course Taxi Wal 🚕\n${heure}\nDépart : ${course.adresse_depart}\nArrivée : ${course.adresse_arrivee}\nMerci de vérifier l'application.`;
  return `https://wa.me/${numero}?text=${encodeURIComponent(texte)}`;
}

let calMoisAffiche = new Date();
calMoisAffiche.setDate(1);
let calJourSelectionne = new Date().toISOString().slice(0, 10);

// ---------- AGENDA / CALENDRIER (toutes les courses, tous chauffeurs) ----------
function joursAvecCoursesAdmin(courses) {
  const map = {};
  (courses || []).forEach(c => {
    const jour = c.date_heure.slice(0, 10);
    map[jour] = (map[jour] || 0) + 1;
  });
  return map;
}

function rendreCalendrierAdmin() {
  const grille = document.getElementById("cal-grille");
  const titre = document.getElementById("cal-titre");
  grille.innerHTML = "";

  ["L", "M", "M", "J", "V", "S", "D"].forEach(n => {
    const d = document.createElement("div");
    d.className = "cal-jour-nom";
    d.textContent = n;
    grille.appendChild(d);
  });

  const annee = calMoisAffiche.getFullYear(), mois = calMoisAffiche.getMonth();
  titre.textContent = calMoisAffiche.toLocaleDateString("fr-BE", { month: "long", year: "numeric" });

  const premierJourSemaine = (new Date(annee, mois, 1).getDay() + 6) % 7;
  const nbJours = new Date(annee, mois + 1, 0).getDate();
  const map = joursAvecCoursesAdmin(dernieresCoursesAdmin);
  const todayStr = new Date().toISOString().slice(0, 10);

  for (let i = 0; i < premierJourSemaine; i++) {
    const vide = document.createElement("div");
    vide.className = "cal-jour hors-mois";
    grille.appendChild(vide);
  }

  for (let jour = 1; jour <= nbJours; jour++) {
    const dateStr = `${annee}-${String(mois + 1).padStart(2, "0")}-${String(jour).padStart(2, "0")}`;
    const cell = document.createElement("div");
    cell.className = "cal-jour"
      + (dateStr === todayStr ? " aujourdhui" : "")
      + (dateStr === calJourSelectionne ? " selectionne" : "");
    cell.textContent = jour;
    if (map[dateStr]) {
      const point = document.createElement("div");
      point.className = "point";
      cell.appendChild(point);
    }
    cell.addEventListener("click", () => {
      calJourSelectionne = dateStr;
      rendreCalendrierAdmin();
    });
    grille.appendChild(cell);
  }

  afficherCoursesDuJourAdmin(calJourSelectionne);
}

function afficherCoursesDuJourAdmin(dateStr) {
  const texte = document.getElementById("agenda-jour-texte");
  const liste = document.getElementById("agenda-liste-jour");
  const dateLisible = new Date(dateStr + "T12:00:00").toLocaleDateString("fr-BE", {
    weekday: "long", day: "2-digit", month: "long"
  });
  texte.textContent = dateLisible;

  const coursesDuJour = dernieresCoursesAdmin.filter(c => c.date_heure.slice(0, 10) === dateStr);
  liste.innerHTML = "";
  if (coursesDuJour.length === 0) {
    liste.innerHTML = '<p style="color:var(--gris); text-align:center; padding:20px 0;">Aucune course ce jour-là.</p>';
    return;
  }
  coursesDuJour.forEach(c => liste.appendChild(construireCarteAdmin(c)));
}

document.getElementById("cal-prev").addEventListener("click", () => {
  calMoisAffiche.setMonth(calMoisAffiche.getMonth() - 1);
  rendreCalendrierAdmin();
});
document.getElementById("cal-next").addEventListener("click", () => {
  calMoisAffiche.setMonth(calMoisAffiche.getMonth() + 1);

});

});

function construireCarteAdmin(course) {

  });

  const nomChauffeur = course.profils?.nom || "Non assigné";
  const labelStatut = {

    ? new Date(course.heure_retour_prevue).toLocaleString("fr-BE", { hour: "2-digit", minute: "2-digit" })

    : course.type_retour === "heure_precise" ? ` (retour à ${heureRetourAffichee})`

  const badgeAllerRetour = course.aller_retour ? `<span class="badge-ar">🔄 Aller-retour${labelTypeRetour}</span>` : "";
  const badgeTaximetre = course.mode_tarification === "taximetre" ? `<span class="badge-ar">🔢 Taximètre</span>` : "";

  const dejaOuverte = coursesOuvertes.has(course.id);

  const entete = document.createElement("div");
  entete.className = "entete-course-admin";
  entete.style.cssText = "cursor:pointer; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;";
  entete.innerHTML = `
    <div style="flex:1;">
      <span class="statut-label">${labelStatut}${course.verrouillee ? " · verrouillée" : ""}${course.origine === "chauffeur" ? " · feuille de route" : ""}${course.origine === "client" ? " · 📱 demande client" : ""}${course.chauffeur_id && (course.statut === "assignee" || course.statut === "en_cours") ? (course.accepte_chauffeur ? " · ✅ acceptée par le chauffeur" : " · ⏳ en attente d'acceptation") : ""}</span>${badgeAllerRetour}${badgeTaximetre}
      <h3>${esc(course.client_nom) || "Client"} — ${esc(prixAffiche)}</h3>
      <div class="heure">${esc(heure)} · Chauffeur : ${esc(nomChauffeur)} · ${esc(course.adresse_depart)} → ${esc(course.adresse_arrivee)}</div>
    </div>
    <span class="chevron-ligne" style="color:var(--gris); flex-shrink:0;">${dejaOuverte ? "▴" : "▾"}</span>
  `;
  const btnSupprimerRapide = document.createElement("button");
  btnSupprimerRapide.textContent = "🗑️";
  btnSupprimerRapide.title = "Supprimer définitivement cette course";
  btnSupprimerRapide.style.cssText = "width:auto; padding:6px 10px; border-radius:8px; border:1px solid var(--rouge); background:transparent; color:var(--rouge); flex-shrink:0; align-self:flex-start;";
  btnSupprimerRapide.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!confirm("Supprimer définitivement cette course ? Cette action est irréversible.")) return;
    const { error } = await supabase.from("courses").delete().eq("id", course.id);
    if (error) { alert("Erreur : " + error.message); return; }
    chargerCoursesAdmin();
  });
  entete.appendChild(btnSupprimerRapide);
  div.appendChild(entete);

  const corps = document.createElement("div");
  corps.className = "corps-course-admin";
  corps.style.display = dejaOuverte ? "block" : "none"; // repliée par défaut — reste ouverte si l'admin l'avait déjà ouverte
  corps.innerHTML = `
    <div class="trajet">
      <b>Départ :</b> ${esc(course.adresse_depart)}<br>
      <b>Arrivée :</b> ${esc(course.adresse_arrivee)}
      ${course.notes ? `<br><b>Note :</b> ${esc(course.notes)}` : ""}
    </div>
  `;
  div.appendChild(corps);

  entete.addEventListener("click", () => {
    const ouvert = corps.style.display !== "none";
    corps.style.display = ouvert ? "none" : "block";
    entete.querySelector(".chevron-ligne").textContent = ouvert ? "▾" : "▴";
    if (ouvert) coursesOuvertes.delete(course.id); else coursesOuvertes.add(course.id);
  });

  // Demande client sans prix encore envoyé : formulaire pour proposer un prix
  if (course.origine === "client" && course.statut === "en_attente" && course.client_id) {
    const blocPrix = document.createElement("div");
    blocPrix.className = "bloc-prix-admin";
    blocPrix.innerHTML = `
      <input type="number" step="0.5" placeholder="Prix à proposer (€)">
      <button type="button">Envoyer le prix</button>
    `;
    blocPrix.querySelector("button").addEventListener("click", async () => {
      const prix = parseFloat(blocPrix.querySelector("input").value);
      if (!prix || prix <= 0) { alert("Indique un prix valide."); return; }
      const acompte = Math.round(prix * 0.3 * 100) / 100;
      await supabase.from("courses").update({ prix, acompte_montant: acompte, statut: "prix_envoye" }).eq("id", course.id);
      notifierClientParEmail(course.id, "prix_envoye");
      chargerCoursesAdmin();
    });
    corps.appendChild(blocPrix);

  // Client a déclaré avoir payé l'acompte : à vérifier puis confirmer
  if (course.statut === "acompte_declare") {
    const blocVerif = document.createElement("div");
    blocVerif.className = "alerte-acompte";
    blocVerif.innerHTML = `
      💰 Le client indique avoir payé l'acompte de <b>${course.acompte_montant} €</b>.<br>

      <button type="button">✅ Confirmer la réception de l'acompte</button>

    blocVerif.querySelector("button").addEventListener("click", async () => {
      await supabase.from("courses").update({
        statut: "confirmee", acompte_paye: true, acompte_confirme_at: new Date().toISOString()
      }).eq("id", course.id);
      notifierClientParEmail(course.id, "acompte_confirme");
      chargerCoursesAdmin();
    });
    corps.appendChild(blocVerif);
  }

  if (course.statut === "confirmee") {
    const note = document.createElement("div");
    note.className = "alerte-acompte";
    note.style.borderColor = "var(--vert)";
    note.innerHTML = `✅ Acompte reçu — la course est dans l'agenda. Attribue-la à un chauffeur ci-dessous.`;
    corps.appendChild(note);
  }

  // Réassignation
  const selectChauffeur = document.createElement("select");
  selectChauffeur.innerHTML = `<option value="">— Réassigner à —</option>` +
    chauffeursCache.map(c => `<option value="${c.id}" ${c.id === course.chauffeur_id ? "selected" : ""}>${c.nom || c.telephone}</option>`).join("");
  selectChauffeur.addEventListener("change", async (e) => {
    const nouveauChauffeurId = e.target.value || null;
    await supabase.from("courses").update({ chauffeur_id: nouveauChauffeurId, statut: "assignee", accepte_chauffeur: false, accepte_a: null }).eq("id", course.id);
    if (nouveauChauffeurId) { notifierChauffeurParEmail(course.id); notifierChauffeurParPush(course.id); } // automatique, aucun clic requis
    chargerCoursesAdmin();
  });
  corps.appendChild(selectChauffeur);

  // Actions : rouvrir / annuler (admin uniquement, même si verrouillée)
  const actions = document.createElement("div");
  actions.className = "ligne-actions";

  if (course.statut === "assignee" || course.statut === "en_attente" || course.statut === "en_cours") {
    const lienWA = lienWhatsappCourse(course);
    if (lienWA) {
      const btnWA = document.createElement("button");
      btnWA.textContent = "📲 Prévenir par WhatsApp";
      btnWA.style.background = "#1f8a4c";
      btnWA.addEventListener("click", () => window.open(lienWA, "_blank"));
      actions.appendChild(btnWA);
    }
  }
  if (course.statut === "terminee") {
    actions.appendChild(creerBoutonAdmin("Rouvrir", async () => {
      await supabase.from("courses").update({ statut: "en_cours", verrouillee: false }).eq("id", course.id);
      chargerCoursesAdmin();
    }));
  }
  if (course.statut !== "annulee") {
    actions.appendChild(creerBoutonAdmin("Annuler la course", async () => {
      await supabase.from("courses").update({ statut: "annulee" }).eq("id", course.id);
      chargerCoursesAdmin();
    }));
  }
  if (actions.children.length > 0) corps.appendChild(actions);

  // Navigation GPS en un clic (ouvre l'app Plans du téléphone avec l'itinéraire)
  const actionsNav = document.createElement("div");
  actionsNav.className = "ligne-actions";
  const btnGps = document.createElement("button");
  btnGps.textContent = "🧭 Itinéraire GPS";
  btnGps.style.background = "#3b82c4";
  btnGps.addEventListener("click", () => {
    const dest = encodeURIComponent(course.adresse_arrivee);
    const dep = encodeURIComponent(course.adresse_depart);
    window.open(`https://www.google.com/maps/dir/?api=1&origin=${dep}&destination=${dest}&travelmode=driving`, "_blank");
  });
  actionsNav.appendChild(btnGps);
  if (course.client_telephone) {
    const btnAppel = document.createElement("button");
    btnAppel.textContent = "📞 Appeler le client";
    btnAppel.style.background = "#dcdcda";
    btnAppel.addEventListener("click", () => { window.location.href = `tel:${course.client_telephone.replace(/\s/g, "")}`; });
    actionsNav.appendChild(btnAppel);
  }
  corps.appendChild(actionsNav);

  // Modifier tous les détails de la course
  const btnModifier = document.createElement("button");
  btnModifier.textContent = "✏️ Modifier la course";

    <label>Adresse d'arrivée</label><input type="text" data-champ="adresse_arrivee" value="${esc(course.adresse_arrivee) || ""}">

    <label>Passagers</label><input type="number" data-champ="passagers" value="${course.passagers ?? 1}" min="1">
    <label>Bagages</label><input type="number" data-champ="bagages" value="${course.bagages ?? 0}" min="0">
    <label>Prix (€)</label><input type="number" step="0.5" data-champ="prix" value="${course.prix ?? ""}">
    <label>Surprime (€) — supplément libre, laisser vide pour aucune</label>
    <div class="ligne-surprime">
      <input type="number" step="0.5" data-champ="surprime" value="${course.surprime ?? ""}" placeholder="ex: 10">
      <button type="button" class="btn-suppr-surprime" title="Supprimer la surprime">🗑️ Supprimer</button>
    </div>
    <div class="ligne-checkbox">
      <input type="checkbox" id="modif-ar-${course.id}" data-champ="aller_retour" ${course.aller_retour ? "checked" : ""}>
      <label for="modif-ar-${course.id}">🔄 Course aller-retour</label>
    </div>
    <label>Mode de tarification</label>
    <select data-champ="mode_tarification">
      <option value="forfait" ${course.mode_tarification !== "taximetre" ? "selected" : ""}>💶 Forfait (prix fixe convenu)</option>
      <option value="taximetre" ${course.mode_tarification === "taximetre" ? "selected" : ""}>🔢 Taximètre (le chauffeur allume le compteur)</option>
    </select>
    <label>Type de retour</label>
    <select data-champ="type_retour" class="modif-type-retour">
      <option value="">—</option>
      <option value="immediat" ${course.type_retour === "immediat" ? "selected" : ""}>Immédiat (≤15 min d'attente)</option>
      <option value="attente" ${course.type_retour === "attente" ? "selected" : ""}>Avec attente (&gt;15 min, durée approximative)</option>
      <option value="heure_precise" ${course.type_retour === "heure_precise" ? "selected" : ""}>Retour à une heure précise</option>
    </select>
    <div class="modif-bloc-attente" style="display:${course.type_retour === "attente" ? "block" : "none"};">
      <label>Durée d'attente estimée</label>
      <input type="text" data-champ="duree_attente_estimee" value="${esc(course.duree_attente_estimee) || ""}" placeholder="ex: 10 à 20 minutes">
    </div>
    <div class="modif-bloc-heure-retour" style="display:${course.type_retour === "heure_precise" ? "block" : "none"};">
      <label>Heure de retour prévue</label>
      <input type="datetime-local" data-champ="heure_retour_prevue" value="${versDatetimeLocal(course.heure_retour_prevue)}">
    </div>
    <label>Notes</label><textarea data-champ="notes">${esc(course.notes) || ""}</textarea>
    <button type="button" class="btn-enregistrer-modif">Enregistrer les modifications</button>
    <button type="button" class="btn-supprimer-course">🗑️ Supprimer définitivement cette course</button>
  `;
  btnModifier.addEventListener("click", () => {
    formModif.style.display = formModif.style.display === "none" ? "block" : "none";
  });
  formModif.querySelector(".modif-type-retour").addEventListener("change", (e) => {
    formModif.querySelector(".modif-bloc-attente").style.display = e.target.value === "attente" ? "block" : "none";

  });
  formModif.querySelector(".btn-suppr-surprime").addEventListener("click", async () => {
    formModif.querySelector('[data-champ="surprime"]').value = "";
    await supabase.from("courses").update({ surprime: null }).eq("id", course.id);
    chargerCoursesAdmin();
  });
  formModif.querySelector(".btn-enregistrer-modif").addEventListener("click", async () => {
    const maj = {};
    const estAllerRetourModif = formModif.querySelector('[data-champ="aller_retour"]').checked;
    const typeRetourChoisi = estAllerRetourModif ? formModif.querySelector('[data-champ="type_retour"]').value : "";
    formModif.querySelectorAll("[data-champ]").forEach(input => {
      const champ = input.dataset.champ;
      if (input.type === "checkbox") { maj[champ] = input.checked; return; }
      let val = input.value;
      if (champ === "date_heure" || champ === "heure_retour_prevue") { maj[champ] = val ? new Date(val).toISOString() : null; return; }
      if (champ === "passagers" || champ === "bagages") { maj[champ] = val ? parseInt(val) : null; return; }
      if (champ === "prix" || champ === "surprime") { maj[champ] = val ? parseFloat(val) : null; return; }
      maj[champ] = val || null;
    });
    // Si la course n'est plus "aller-retour", on efface tout ce qui concerne le retour
    if (!estAllerRetourModif) { maj.type_retour = null; maj.duree_attente_estimee = null; maj.heure_retour_prevue = null; }
    // Ne garde la durée d'attente que si "attente" est sélectionné, et l'heure de retour que si "heure_precise" est sélectionné
    if (typeRetourChoisi !== "attente") maj.duree_attente_estimee = null;
    if (typeRetourChoisi !== "heure_precise") maj.heure_retour_prevue = null;
    const { error } = await supabase.from("courses").update(maj).eq("id", course.id);
    if (error) { alert("Erreur : " + error.message); return; }
    chargerCoursesAdmin();
  });

// ---------- AUTOCOMPLÉTION D'ADRESSES (historique interne + suggestions OpenStreetMap) ----------
// Se souvient de toutes les adresses déjà utilisées dans l'app, et propose aussi des adresses
// réelles (rue + numéro) via Photon (moteur gratuit basé sur OpenStreetMap, sans clé API).
const cacheAdressesRecentes = { chargees: false, liste: [] };

async function chargerAdressesRecentes() {
  if (cacheAdressesRecentes.chargees) return cacheAdressesRecentes.liste;
  const { data, error } = await supabase
    .from("courses")
    .select("adresse_depart, adresse_arrivee")
    .order("date_heure", { ascending: false })
    .limit(300);
  if (error) { console.error(error); return []; }
  const set = new Set();
  (data || []).forEach(c => {
    if (c.adresse_depart) set.add(c.adresse_depart.trim());
    if (c.adresse_arrivee) set.add(c.adresse_arrivee.trim());
  });
  cacheAdressesRecentes.liste = Array.from(set);
  cacheAdressesRecentes.chargees = true;
  return cacheAdressesRecentes.liste;
}
// Vide le cache après création d'une course, pour que la toute nouvelle adresse soit proposée la prochaine fois
function invaliderCacheAdresses() { cacheAdressesRecentes.chargees = false; }

async function suggestionsAdressesReelles(texte) {
  try {
    // Centré sur la région de Boussu/Mons pour prioriser les résultats locaux, sans bloquer le reste
    const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(texte)}&lat=50.43&lon=3.79&limit=6&lang=fr`;
    const res = await fetch(url);
    const data = await res.json();
    return (data.features || [])
      .filter(f => ["be", "fr"].includes((f.properties.countrycode || "").toLowerCase()))
      .map(f => {
        const p = f.properties;
        const ligne1 = [p.housenumber, p.street || p.name].filter(Boolean).join(" ");
        const ligne2 = [p.postcode, p.city].filter(Boolean).join(" ");
        return [ligne1, ligne2].filter(Boolean).join(", ");
      })
      .filter((v, i, arr) => v && arr.indexOf(v) === i); // dédoublonne
  } catch (e) { console.error("Suggestions d'adresses impossibles :", e); return []; }
}

function configurerAutocompleteAdresse(input) {
  const liste = document.createElement("div");
  liste.className = "liste-suggestions-adresse";
  input.insertAdjacentElement("afterend", liste);
  let idRequete = 0;

  function fermerListe() { liste.innerHTML = ""; liste.style.display = "none"; }

  function afficherSuggestions(items) {
    if (!items.length) { fermerListe(); return; }
    liste.innerHTML = items.map(({ texte, recente }) =>
      `<div class="suggestion-adresse">${recente ? '<span class="puce-recente">●</span>' : ""}${texte}</div>`
    ).join("");
    liste.style.display = "block";
    liste.querySelectorAll(".suggestion-adresse").forEach((el, i) => {
      el.addEventListener("mousedown", (e) => {
        e.preventDefault();
        input.value = items[i].texte;
        fermerListe();
      });
    });
  }

  input.addEventListener("input", async () => {
    const texte = input.value.trim();
    const requeteActuelle = ++idRequete;
    if (texte.length < 2) { fermerListe(); return; }

    const recentes = (await chargerAdressesRecentes())
      .filter(a => a.toLowerCase().includes(texte.toLowerCase()))
      .slice(0, 4);
    if (requeteActuelle !== idRequete) return; // une saisie plus récente a eu lieu entre-temps
    afficherSuggestions(recentes.map(t => ({ texte: t, recente: true })));

    // Les suggestions d'adresses réelles arrivent un peu après (petite latence réseau) et se rajoutent
    const distantes = await suggestionsAdressesReelles(texte);
    if (requeteActuelle !== idRequete) return;
    const dejaLa = new Set(recentes);
    const finales = [
      ...recentes.map(t => ({ texte: t, recente: true })),
      ...distantes.filter(a => !dejaLa.has(a)).map(t => ({ texte: t, recente: false }))
    ].slice(0, 7);
    afficherSuggestions(finales);
  });

  input.addEventListener("blur", () => setTimeout(fermerListe, 150));
}

configurerAutocompleteAdresse(document.getElementById("input-depart"));

// ---------- CARTE DES CHAUFFEURS (statut + destination + temps restant) ----------
let carteLeaflet = null;
let marqueurs = {};
let lignesRouteCarte = {}; // chauffeur_id -> polyligne de l'itinéraire en cours
let marqueursDestinationCarte = {}; // chauffeur_id -> marqueur 🏁 de destination
const cacheGeocodage = {}; // adresse -> {lat, lon}
const cacheEta = {}; // course_id -> { minutes, texte, calculeA: timestamp }

async function geocoderAdresse(adresse) {
  if (cacheGeocodage[adresse]) return cacheGeocodage[adresse];
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=be,fr&q=${encodeURIComponent(adresse)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data && data[0]) {
      const point = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
      cacheGeocodage[adresse] = point;
      return point;
    }
  } catch (e) { console.error("Géocodage impossible :", e); }
  return null;
}

async function calculerEta(courseId, depLat, depLon, adresseArrivee) {
  // Réutilise un calcul récent (moins de 60s) pour ne pas spammer les services gratuits
  const cache = cacheEta[courseId];
  if (cache && (Date.now() - cache.calculeA) < 60000) return cache;

  const dest = await geocoderAdresse(adresseArrivee);
  if (!dest) return null;

  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${depLon},${depLat};${dest.lon},${dest.lat}?overview=false`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.routes && data.routes[0]) {
      const minutes = Math.round(data.routes[0].duration / 60);
      const resultat = { minutes, texte: `${minutes} min`, calculeA: Date.now() };
      cacheEta[courseId] = resultat;
      return resultat;
    }
  } catch (e) { console.error("Calcul ETA impossible :", e); }
  return null;
}

// Calcul générique de trajet routier entre deux coordonnées (utilisé par le retour centrale + l'outil manuel)
async function calculerTrajetCoords(depLat, depLon, arrLat, arrLon) {
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${depLon},${depLat};${arrLon},${arrLat}?overview=false`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.routes && data.routes[0]) {
      return { minutes: Math.round(data.routes[0].duration / 60), km: (data.routes[0].distance / 1000).toFixed(1) };
    }
  } catch (e) { console.error("Calcul de trajet impossible :", e); }
  return null;
}

// Comme calculerTrajetCoords, mais renvoie aussi le tracé complet de l'itinéraire (pour le dessiner sur la carte)
const cacheGeometrieRoute = {}; // "depLat,depLon|arrLat,arrLon" -> résultat (30s)
async function calculerTrajetAvecGeometrie(depLat, depLon, arrLat, arrLon) {
  const cle = `${depLat.toFixed(4)},${depLon.toFixed(4)}|${arrLat.toFixed(4)},${arrLon.toFixed(4)}`;
  const cache = cacheGeometrieRoute[cle];
  if (cache && (Date.now() - cache.calculeA) < 30000) return cache;
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${depLon},${depLat};${arrLon},${arrLat}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.routes && data.routes[0]) {
      const resultat = {
        minutes: Math.round(data.routes[0].duration / 60),
        km: (data.routes[0].distance / 1000).toFixed(1),
        coords: data.routes[0].geometry.coordinates.map(([lon, lat]) => [lat, lon]),
        calculeA: Date.now()
      };
      cacheGeometrieRoute[cle] = resultat;
      return resultat;
    }
  } catch (e) { console.error("Calcul d'itinéraire impossible :", e); }
  return null;
}

// Retire de la carte le tracé et le drapeau de destination d'un chauffeur (ex: course terminée)
function retirerRouteCarte(chauffeurId) {
  if (lignesRouteCarte[chauffeurId]) { carteLeaflet.removeLayer(lignesRouteCarte[chauffeurId]); delete lignesRouteCarte[chauffeurId]; }
  if (marqueursDestinationCarte[chauffeurId]) { carteLeaflet.removeLayer(marqueursDestinationCarte[chauffeurId]); delete marqueursDestinationCarte[chauffeurId]; }
}

// Trace (ou met à jour) sur la carte l'itinéraire complet du chauffeur vers sa destination,
// avec un repère 🏁 à l'arrivée — pour voir en un coup d'œil par où il passe et où il va.
async function tracerRouteVersDestination(chauffeurId, nom, depLat, depLon, adresseArrivee) {
  const dest = await geocoderAdresse(adresseArrivee);
  if (!dest) return;
  const route = await calculerTrajetAvecGeometrie(depLat, depLon, dest.lat, dest.lon);
  if (!route) return;

  if (lignesRouteCarte[chauffeurId]) {
    lignesRouteCarte[chauffeurId].setLatLngs(route.coords);
  } else {
    lignesRouteCarte[chauffeurId] = L.polyline(route.coords, { color: "#c81e2c", weight: 4, opacity: 0.75 }).addTo(carteLeaflet);
  }

  const iconeDestination = L.divIcon({
    className: "",
    html: `<div style="font-size:24px; line-height:1;">🏁</div>`,
    iconSize: [26, 26], iconAnchor: [13, 22]
  });
  const popupDestination = `<b>${nom}</b><br>🏁 Destination : ${adresseArrivee}`;
  if (marqueursDestinationCarte[chauffeurId]) {
    marqueursDestinationCarte[chauffeurId].setLatLng([dest.lat, dest.lon]);
    marqueursDestinationCarte[chauffeurId].setPopupContent(popupDestination);
  } else {
    marqueursDestinationCarte[chauffeurId] = L.marker([dest.lat, dest.lon], { icon: iconeDestination })
      .addTo(carteLeaflet)
      .bindPopup(popupDestination);
  }
}

const cacheRetourCentrale = {}; // adresse destination -> résultat (60s)
function getAdresseCentrale() {
  return document.getElementById("calc-adresse-centrale").value.trim() || "Boussu, Belgique";
}
async function calculerRetourCentrale(adresseDepuis) {
  const cle = adresseDepuis + "|" + getAdresseCentrale();
  const cache = cacheRetourCentrale[cle];
  if (cache && (Date.now() - cache.calculeA) < 60000) return cache;

  const depart = await geocoderAdresse(adresseDepuis);
  const centrale = await geocoderAdresse(getAdresseCentrale());
  if (!depart || !centrale) return null;

  const trajet = await calculerTrajetCoords(depart.lat, depart.lon, centrale.lat, centrale.lon);
  if (!trajet) return null;
  const resultat = { ...trajet, calculeA: Date.now() };
  cacheRetourCentrale[cle] = resultat;
  return resultat;
}

const adresseCentraleInput = document.getElementById("calc-adresse-centrale");
adresseCentraleInput.value = localStorage.getItem("taxiwal_adresse_centrale") || "Boussu, Belgique";
adresseCentraleInput.addEventListener("change", () => {

});

const cacheAdresseInverse = {}; // "lat,lon" -> adresse lisible (évite de re-demander sans arrêt)
async function adresseDepuisCoords(lat, lon) {
  const cle = lat.toFixed(4) + "," + lon.toFixed(4);
  if (cacheAdresseInverse[cle]) return cacheAdresseInverse[cle];
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;
    const res = await fetch(url);
    const data = await res.json();
    const adresse = data?.display_name || `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    cacheAdresseInverse[cle] = adresse;
    return adresse;
  } catch (e) { console.error("Adresse introuvable :", e); return `${lat.toFixed(5)}, ${lon.toFixed(5)}`; }
}

// Copie l'adresse d'un chauffeur dans le presse-papier (appelée depuis le HTML des popups/cartes)
window.copierAdresseChauffeur = function (texte) {

      () => alert("Impossible de copier automatiquement. Adresse :\n" + texte)
    );

    alert("Adresse :\n" + texte);
  }
};

// ---------- LISTE DES CHAUFFEURS EN DIRECT (dépose + retour centrale) ----------
async function afficherListeChauffeursCarte(positions, coursesParChauffeur) {
  const conteneur = document.getElementById("carte-liste-chauffeurs");
  conteneur.innerHTML = "";

  for (const p of (positions || [])) {
    const nom = p.profils?.nom || "Chauffeur";
    const courseActive = coursesParChauffeur[p.chauffeur_id];

    const div = document.createElement("div");
    div.className = "cc-chauffeur " + (courseActive ? "cc-course" : (p.disponible ? "cc-dispo" : ""));

    if (courseActive) {
      div.innerHTML = `<h4>${nom}</h4>
        <div class="cc-ligne">🚕 En route vers <b>${courseActive.adresse_arrivee}</b></div>
        <div class="cc-ligne">📍 Position actuelle : <span id="cc-adresse-${p.chauffeur_id}">chargement…</span>
          <button onclick="copierAdresseChauffeur(document.getElementById('cc-adresse-${p.chauffeur_id}').textContent)" style="width:auto; padding:2px 8px; font-size:.75rem; margin-left:4px;">📋 Copier</button></div>
        <div class="cc-ligne">⏱️ Dépose du client : <b id="cc-depose-${courseActive.id}">calcul…</b></div>
        <div class="cc-ligne">↩️ Retour centrale ensuite : <b id="cc-retour-${courseActive.id}">calcul…</b></div>`;
      conteneur.appendChild(div);

      calculerEta(courseActive.id, p.latitude, p.longitude, courseActive.adresse_arrivee).then(eta => {
        const el = document.getElementById(`cc-depose-${courseActive.id}`);
        if (el) el.textContent = eta ? `dans environ ${eta.texte} (arrivée ~${heureDansXMinutes(eta.minutes)})` : "indisponible";
      });
      calculerRetourCentrale(courseActive.adresse_arrivee).then(retour => {
        const el = document.getElementById(`cc-retour-${courseActive.id}`);
        if (el) el.textContent = retour ? `environ ${retour.minutes} min (${retour.km} km)` : "indisponible";
      });
    } else {
      div.innerHTML = `<h4>${nom}</h4>
        <div class="cc-ligne">${p.disponible ? "✅ Disponible" : "⛔ Hors service"}</div>
        <div class="cc-ligne">📍 Position actuelle : <span id="cc-adresse-${p.chauffeur_id}">chargement…</span>
          <button onclick="copierAdresseChauffeur(document.getElementById('cc-adresse-${p.chauffeur_id}').textContent)" style="width:auto; padding:2px 8px; font-size:.75rem; margin-left:4px;">📋 Copier</button></div>`;
      conteneur.appendChild(div);
    }

    adresseDepuisCoords(p.latitude, p.longitude).then(adresse => {
      const el = document.getElementById(`cc-adresse-${p.chauffeur_id}`);
      if (el) el.textContent = adresse;
    });
  }

  if (!positions || positions.length === 0) {
    conteneur.innerHTML = '<p style="color:var(--gris); text-align:center;">Aucun chauffeur avec position partagée pour le moment.</p>';
  }
}

function heureDansXMinutes(minutes) {
  const d = new Date(Date.now() + minutes * 60000);
  return d.toLocaleTimeString("fr-BE", { hour: "2-digit", minute: "2-digit" });
}

document.getElementById("btn-calculer-trajet").addEventListener("click", async () => {
  const resultatDiv = document.getElementById("calc-resultat");
  resultatDiv.classList.add("visible");
  resultatDiv.textContent = "Calcul en cours…";

  const arriveeTexte = document.getElementById("calc-arrivee-adresse").value.trim();
  if (!arriveeTexte) { resultatDiv.textContent = "Indique une adresse d'arrivée."; return; }

  let depLat, depLon, libelleDepart;

  if (document.getElementById("calc-depart-type").value === "chauffeur") {
    const chauffeurId = document.getElementById("calc-depart-chauffeur").value;
    const position = dernieresPositionsCarte.find(p => p.chauffeur_id === chauffeurId);
    if (!position) { resultatDiv.textContent = "Ce chauffeur n'a pas de position partagée actuellement."; return; }
    depLat = position.latitude; depLon = position.longitude;
    libelleDepart = `la position actuelle de ${position.profils?.nom || "ce chauffeur"}`;
  } else {
    const departTexte = document.getElementById("calc-depart-adresse").value.trim();
    if (!departTexte) { resultatDiv.textContent = "Indique une adresse de départ."; return; }
    const depart = await geocoderAdresse(departTexte);
    if (!depart) { resultatDiv.textContent = "Adresse de départ introuvable."; return; }
    depLat = depart.lat; depLon = depart.lon;
    libelleDepart = departTexte;
  }

  const arrivee = await geocoderAdresse(arriveeTexte);
  if (!arrivee) { resultatDiv.textContent = "Adresse d'arrivée introuvable."; return; }

  const trajet = await calculerTrajetCoords(depLat, depLon, arrivee.lat, arrivee.lon);
  if (!trajet) { resultatDiv.textContent = "Calcul impossible pour le moment."; return; }

  resultatDiv.innerHTML = `Entre <b>${libelleDepart}</b> et <b>${arriveeTexte}</b> :<br>
    ⏱️ Environ <b>${trajet.minutes} min</b> (${trajet.km} km) — arrivée estimée vers <b>${heureDansXMinutes(trajet.minutes)}</b>.`;
});

async function chargerCarte() {
  if (!carteLeaflet) {
    carteLeaflet = L.map("carte").setView([50.45, 4.10], 10); // centré Belgique par défaut
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    }).addTo(carteLeaflet);
    setTimeout(() => carteLeaflet.invalidateSize(), 200);
  }

  const { data: positions, error } = await supabase
    .from("positions_chauffeurs")
    .select("*, profils:chauffeur_id(nom)");
  if (error) { console.error(error); return; }

  // Courses en cours, pour savoir qui roule vers où
  const { data: coursesEnCours } = await supabase
    .from("courses")
    .select("id, chauffeur_id, adresse_arrivee")
    .eq("statut", "en_cours");
  const coursesParChauffeur = {};
  (coursesEnCours || []).forEach(c => { coursesParChauffeur[c.chauffeur_id] = c; });

  dernieresPositionsCarte = positions || [];
  afficherListeChauffeursCarte(positions, coursesParChauffeur);

  // Retire le tracé de tout chauffeur qui n'est plus en course actuellement
  Object.keys(lignesRouteCarte).forEach(chauffeurId => {
    if (!coursesParChauffeur[chauffeurId]) retirerRouteCarte(chauffeurId);
  });

  for (const p of (positions || [])) {
    const nom = p.profils?.nom || "Chauffeur";
    const courseActive = coursesParChauffeur[p.chauffeur_id];

    let couleur = "gray";
    let popup = `<b>${nom}</b><br>Hors service`;

    if (courseActive) {
      couleur = "red";
      popup = `<b>${nom}</b><br>🚕 En course<br>Vers : ${courseActive.adresse_arrivee}<br>📍 <span id="popup-adr-${p.chauffeur_id}">chargement…</span> <button onclick="copierAdresseChauffeur(document.getElementById('popup-adr-${p.chauffeur_id}').textContent)" style="width:auto; padding:1px 6px; font-size:.7rem;">📋</button><br><span id="eta-${courseActive.id}">Calcul du temps restant…</span>`;
    } else if (p.disponible) {
      couleur = "green";
      popup = `<b>${nom}</b><br>✅ Disponible<br>📍 <span id="popup-adr-${p.chauffeur_id}">chargement…</span> <button onclick="copierAdresseChauffeur(document.getElementById('popup-adr-${p.chauffeur_id}').textContent)" style="width:auto; padding:1px 6px; font-size:.7rem;">📋</button>`;
    }

    const icone = L.divIcon({
      className: "",
      html: `<div style="width:16px;height:16px;border-radius:50%;background:${couleur};border:2px solid #fff;"></div>`,
      iconSize: [16, 16]
    });

    if (marqueurs[p.chauffeur_id]) {
      marqueurs[p.chauffeur_id].setLatLng([p.latitude, p.longitude]);
      marqueurs[p.chauffeur_id].setIcon(icone);
      marqueurs[p.chauffeur_id].setPopupContent(popup);
    } else {
      marqueurs[p.chauffeur_id] = L.marker([p.latitude, p.longitude], { icon: icone })
        .addTo(carteLeaflet)
        .bindPopup(popup);
    }

    // Calcule le temps restant en tâche de fond et met à jour le popup si ouvert,
    // et trace l'itinéraire complet + le repère 🏁 de destination sur la carte
    if (courseActive) {
      calculerEta(courseActive.id, p.latitude, p.longitude, courseActive.adresse_arrivee).then(eta => {
        const span = document.getElementById(`eta-${courseActive.id}`);
        if (span) span.textContent = eta ? `⏱️ Environ ${eta.texte} avant dépose` : "Temps restant indisponible";
      });
      tracerRouteVersDestination(p.chauffeur_id, nom, p.latitude, p.longitude, courseActive.adresse_arrivee);
    } else {
      retirerRouteCarte(p.chauffeur_id);
    }
    // Résout l'adresse lisible en tâche de fond et met à jour la popup (ouverte ou non)
    adresseDepuisCoords(p.latitude, p.longitude).then(adresse => {
      const span = document.getElementById(`popup-adr-${p.chauffeur_id}`);
      if (span) span.textContent = adresse;
      const popupObj = marqueurs[p.chauffeur_id]?.getPopup();
      if (popupObj) popupObj.setContent(popupObj.getContent().replace("chargement…", adresse));
    });
  }
}

// ---------- CAISSE (fond du matin + suivi cash/carte) ----------
async function chargerCaisse() {
  const conteneur = document.getElementById("liste-caisse");
  conteneur.innerHTML = "Chargement…";

  const aujourdHui = new Date().toISOString().slice(0, 10); // YYYY-MM-DD

  // Chauffeurs actifs
  const { data: chauffeurs } = await supabase
    .from("profils").select("id, nom").eq("role", "chauffeur").eq("actif", true);

  // Fonds de caisse du jour
  const { data: fonds } = await supabase
    .from("fonds_de_caisse").select("*").eq("date", aujourdHui);
  const fondParChauffeur = {};
  (fonds || []).forEach(f => { fondParChauffeur[f.chauffeur_id] = f; });

  // Courses terminées aujourd'hui, avec mode de paiement
  const debutJour = aujourdHui + "T00:00:00";
  const finJour = aujourdHui + "T23:59:59";
  const { data: courses } = await supabase
    .from("courses")
    .select("chauffeur_id, prix, mode_paiement, statut, date_heure")
    .eq("statut", "terminee")
    .gte("date_heure", debutJour)
    .lte("date_heure", finJour);

  conteneur.innerHTML = "";

  (chauffeurs || []).forEach(ch => {
    const fond = fondParChauffeur[ch.id];
    const montantFond = fond ? parseFloat(fond.montant_initial) : 0;

    const coursesChauffeur = (courses || []).filter(c => c.chauffeur_id === ch.id);
    const coursesCash = coursesChauffeur.filter(c => c.mode_paiement === "cash");
    const coursesCarte = coursesChauffeur.filter(c => c.mode_paiement === "carte");
    const coursesFacture = coursesChauffeur.filter(c => c.mode_paiement === "facture");
    const totalCash = coursesCash.reduce((s, c) => s + (parseFloat(c.prix) || 0), 0);
    const totalCarte = coursesCarte.reduce((s, c) => s + (parseFloat(c.prix) || 0), 0);
    const totalFacture = coursesFacture.reduce((s, c) => s + (parseFloat(c.prix) || 0), 0);
    const caisseActuelle = montantFond + totalCash; // seul le cash constitue de l'argent physique en poche

    const div = document.createElement("div");
    div.className = "caisse-chauffeur";
    div.innerHTML = `
      <h3>${ch.nom || "Chauffeur"}</h3>
      <div class="caisse-ligne"><span>Fond de caisse du matin</span><b>${montantFond.toFixed(2)} €</b></div>
      <div class="caisse-ligne"><span>💵 Cash — ${coursesCash.length} course(s)</span><b>${totalCash.toFixed(2)} €</b></div>
      <div class="caisse-ligne"><span>💳 Carte — ${coursesCarte.length} course(s)</span><b>${totalCarte.toFixed(2)} €</b></div>
      <div class="caisse-ligne"><span>🧾 Facture — ${coursesFacture.length} course(s)</span><b>${totalFacture.toFixed(2)} €</b></div>
      <div class="caisse-total"><span>Caisse actuelle (espèces)</span><span>${caisseActuelle.toFixed(2)} €</span></div>
      <div class="caisse-fond">
        <input type="number" step="0.5" placeholder="Nouveau fond (€)" id="input-fond-${ch.id}" value="${montantFond || ""}">
        <button data-chauffeur="${ch.id}" class="btn-enregistrer-fond">Enregistrer</button>
      </div>
    `;
    conteneur.appendChild(div);
  });

  document.querySelectorAll(".btn-enregistrer-fond").forEach(btn => {
    btn.addEventListener("click", async () => {
      const chauffeurId = btn.dataset.chauffeur;
      const montant = parseFloat(document.getElementById(`input-fond-${chauffeurId}`).value) || 0;
      const { data: { user } } = await supabase.auth.getUser();

      await supabase.from("fonds_de_caisse").upsert({
        chauffeur_id: chauffeurId,
        date: aujourdHui,
        montant_initial: montant,
        created_by: user?.id || null
      }, { onConflict: "chauffeur_id,date" });

      chargerCaisse();
    });
  });
}

  });
}

// Convertit "HH:MM" en minutes depuis minuit ; renvoie null si vide/invalide
function minutesDepuisHeure(heureStr) {
  if (!heureStr) return null;
  const [h, m] = heureStr.split(":").map(Number);
  if (Number.isNaN(h) || Number.isNaN(m)) return null;
  return h * 60 + m;
}
function formatDureeMinutes(total) {
  if (total === null) return "";
  const h = Math.floor(total / 60), m = total % 60;
  return `${h}h${String(m).padStart(2, "0")}`;
}
