  imprimerFeuilleDeRoute(feuille, lignes || [], chauffeur || { nom: "" }, feuille.date_service);
}

function decalerDateFA(jours) {
  const d = new Date(document.getElementById("fa-date").value + "T00:00:00");
  d.setDate(d.getDate() + jours);
  document.getElementById("fa-date").value = d.toISOString().slice(0, 10);
  chargerFeuillesAdmin();
}

let chargementFeuillesEnCours = false;
async function chargerFeuillesAdmin(dejaCreees = false) {
  if (chargementFeuillesEnCours && !dejaCreees) return;
  chargementFeuillesEnCours = true;
  try {
    await chargerFeuillesAdminInterne(dejaCreees);
  } finally {
    chargementFeuillesEnCours = false;
  }
}

async function chargerFeuillesAdminInterne(dejaCreees) {
  const conteneur = document.getElementById("liste-feuilles-admin");
  const dateChoisie = document.getElementById("fa-date").value;
  if (!conteneur.children.length) conteneur.innerHTML = "Chargement…";

  const { data: chauffeurs, error: erreurChauffeurs } = await supabase
    .from("profils")
    .select("id, nom")
    .eq("role", "chauffeur")
    .eq("actif", true)
    .order("nom", { ascending: true });

  if (erreurChauffeurs) { conteneur.innerHTML = "Erreur : " + esc(erreurChauffeurs.message); return; }

  const { data: feuilles, error } = await supabase
    .from("feuilles_route")
    .select("*, profils:chauffeur_id(nom), vehicules:vehicule_id(nom, plaque, numero_identification, identite_exploitant)")
    .eq("date_service", dateChoisie)
    .order("created_at", { ascending: true });

  if (error) { conteneur.innerHTML = "Erreur : " + esc(error.message); return; }

  if (!chauffeurs || chauffeurs.length === 0) {
    conteneur.innerHTML = '<p id="feuilles-vide">Aucun chauffeur actif enregistré.</p>';
    return;
  }

  const chauffeursSansFeuille = chauffeurs.filter(ch => !(feuilles || []).some(f => f.chauffeur_id === ch.id));
  if (chauffeursSansFeuille.length > 0 && !dejaCreees) {
    for (const chauffeur of chauffeursSansFeuille) {
      const { data: vehicule } = await supabase
        .from("vehicules").select("id").eq("chauffeur_id", chauffeur.id).eq("actif", true).limit(1).maybeSingle();
      await supabase.from("feuilles_route").insert({
        chauffeur_id: chauffeur.id, date_service: dateChoisie, vehicule_id: vehicule?.id || null
      });
    }
    return chargerFeuillesAdminInterne(true);
  }

  const feuilleIds = (feuilles || []).map(f => f.id);
  const { data: toutesLignes } = feuilleIds.length
    ? await supabase.from("lignes_feuille_route").select("*, courses(statut, mode_paiement)").in("feuille_route_id", feuilleIds).order("n_ordre", { ascending: true })
    : { data: [] };

  conteneur.innerHTML = "";
  // Un chauffeur peut avoir PLUSIEURS feuilles le même jour (changement de véhicule en cours de
  // journée) : on les affiche toutes, numérotées "Feuille 1/2" s'il y en a plusieurs.
  chauffeurs.forEach(chauffeur => {
    const feuillesChauffeur = (feuilles || []).filter(f => f.chauffeur_id === chauffeur.id);
    if (feuillesChauffeur.length === 0) return;
    feuillesChauffeur.forEach((feuille, idx) => {
      const lignes = (toutesLignes || []).filter(l => l.feuille_route_id === feuille.id);
      conteneur.appendChild(construireFeuilleAdmin(feuille, lignes, dateChoisie, chauffeur, feuillesChauffeur.length > 1 ? idx + 1 : null, feuillesChauffeur.length));
    });
  });
}

function minutesDepuisHeure(heureStr) {
  if (!heureStr) return null;
  const [h, m] = heureStr.split(":").map(Number);
  if (Number.isNaN(h) || Number.isNaN(m)) return null;
  return h * 60 + m;
}
function formatDureeMinutes(total) {
  if (total === null) return "";
  const h = Math.floor(total / 60), m = total % 60;
  return `${h}h${String(m).padStart(2, "0")}`;
}

const feuillesDepliees = new Set();
const lignesDepliees = new Set();
const etatManuelLignesAdmin = new Map();

function construireFeuilleAdmin(feuille, lignes, dateChoisie, chauffeur, numeroFeuille, totalFeuillesChauffeur) {
  const div = document.createElement("div");
  div.className = "feuille-admin" + (feuille.verrouillee ? " verrouillee-fa" : "");

  const entete = document.createElement("div");
  const identiteFeuille = feuille.vehicules?.identite_exploitant || IDENTITE_EXPLOITANT;
  const labelFeuille = numeroFeuille ? ` — Feuille ${numeroFeuille}/${totalFeuillesChauffeur} (changement de véhicule)` : "";
  entete.innerHTML = `
    <div class="entete-fa-titre">
      <div class="entete-fa-info" style="cursor:pointer;">
        <div class="identite-exploitant">${esc(identiteFeuille)} · Date : ${new Date(dateChoisie + "T12:00:00").toLocaleDateString("fr-BE")}</div>
        <h3>Nom du chauffeur : ${esc(feuille.profils?.nom || "Chauffeur")}${esc(labelFeuille)} <span class="chevron-ligne">▾</span></h3>
        <div class="sous">Véhicule : ${feuille.vehicules ? (esc(feuille.vehicules.nom) + (feuille.vehicules.plaque ? " · plaque " + esc(feuille.vehicules.plaque) : "") + (feuille.vehicules.numero_identification ? " · n° identification " + esc(feuille.vehicules.numero_identification) : "")) : "Aucun véhicule assigné"} · ${feuille.verrouillee ? "🔒 Signée / clôturée" : "En cours"}${feuille.recettes_fin != null && feuille.recettes_debut != null ? " · Recettes : " + (parseFloat(feuille.recettes_fin) - parseFloat(feuille.recettes_debut)).toFixed(2) + " €" : ""}</div>
      </div>
      <div class="entete-fa-actions">
        <button class="btn-verrou ${feuille.verrouillee ? "rouvrir" : "cloturer"}">${feuille.verrouillee ? "🔓 Rouvrir pour le chauffeur" : "🔒 Signer / clôturer"}</button>
        <button class="btn-details-fa">▾ Détails</button>
        <button class="btn-nouvelle-course-fa">+ Course</button>
        <button class="btn-imprimer-fa">🖨️ Imprimer / PDF</button>
      </div>
    </div>
  `;
  entete.querySelector(".btn-verrou").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const nom = feuille.profils?.nom || "ce chauffeur";
    if (feuille.verrouillee) {
      if (!confirm(`Rouvrir la feuille de ${nom} ?\n\nElle redevient modifiable et réapparaît normalement dans son application.`)) return;
      btn.disabled = true; btn.textContent = "Réouverture…";
      const { error } = await supabase.rpc("admin_deverrouiller_feuille", { p_feuille_id: feuille.id });
      if (error) { alert("Erreur : " + error.message); btn.disabled = false; return; }
    } else {
      if (!confirm(`Signer et clôturer la feuille de ${nom} ?\n\nLe chauffeur ne pourra plus la modifier (tu pourras toujours la rouvrir).`)) return;
      btn.disabled = true; btn.textContent = "Clôture…";
      const { error } = await supabase.from("feuilles_route").update({ verrouillee: true, signee: true }).eq("id", feuille.id);
      if (error) { alert("Erreur : " + error.message); btn.disabled = false; return; }
    }
    chargerFeuillesAdmin();
  });
  entete.querySelector(".btn-nouvelle-course-fa").addEventListener("click", () => {
    ouvrirModaleCourse({ chauffeurId: chauffeur.id, date: dateChoisie + "T09:00" });
  });
  entete.querySelector(".btn-imprimer-fa").addEventListener("click", () => {
    imprimerFeuilleDeRoute(feuille, lignes, chauffeur, dateChoisie);
  });
  div.appendChild(entete);

  const corps = document.createElement("div");
  const ouvertParDefaut = feuillesDepliees.has(feuille.id) || !feuille.verrouillee;
  corps.style.display = ouvertParDefaut ? "block" : "none";
  entete.querySelector(".chevron-ligne").textContent = ouvertParDefaut ? "▴" : "▾";
  entete.querySelector(".btn-details-fa").textContent = ouvertParDefaut ? "▴ Masquer" : "▾ Détails";
  function toggleCorps() {
    const ouvert = corps.style.display !== "none";
    corps.style.display = ouvert ? "none" : "block";
    if (ouvert) feuillesDepliees.delete(feuille.id); else feuillesDepliees.add(feuille.id);
    entete.querySelector(".chevron-ligne").textContent = ouvert ? "▾" : "▴";
    entete.querySelector(".btn-details-fa").textContent = ouvert ? "▾ Détails" : "▴ Masquer";
  }
  entete.querySelector(".entete-fa-info").addEventListener("click", toggleCorps);
  entete.querySelector(".btn-details-fa").addEventListener("click", (e) => { e.stopPropagation(); toggleCorps(); });

  const blocHeures = document.createElement("div");
  blocHeures.className = "bloc-service-fa";
  blocHeures.innerHTML = `<div class="sous-titre-fa">Heures des prestations</div>`;
  const grilleHeures = document.createElement("div");
  grilleHeures.className = "grille3-fa";
  const totalHeures = document.createElement("div");
  totalHeures.className = "total-fa";
  [["heure_debut", "Début", "time"], ["heure_fin", "Fin", "time"], ["interruptions", "Interruptions", "text"]].forEach(([champ, libelle, type]) => {
    const wrap = document.createElement("div");
    const lab = document.createElement("label"); lab.textContent = libelle;
    const input = document.createElement("input");
    input.type = type;
    input.value = feuille[champ] ? (type === "time" ? String(feuille[champ]).slice(0, 5) : feuille[champ]) : "";
    input.dataset.champHeure = champ;
    input.addEventListener("change", async (e) => {
      await supabase.from("feuilles_route").update({ [champ]: e.target.value || null }).eq("id", feuille.id);
      const debutMin = minutesDepuisHeure(grilleHeures.querySelector('[data-champ-heure="heure_debut"]').value);
      const finMin = minutesDepuisHeure(grilleHeures.querySelector('[data-champ-heure="heure_fin"]').value);
      const total = (debutMin !== null && finMin !== null) ? formatDureeMinutes((finMin - debutMin + 1440) % 1440) : "";
      totalHeures.textContent = total ? "Total : " + total : "";
    });
    wrap.appendChild(lab); wrap.appendChild(input);
    grilleHeures.appendChild(wrap);
  });
  blocHeures.appendChild(grilleHeures);
  const dMin = minutesDepuisHeure(feuille.heure_debut), fMin = minutesDepuisHeure(feuille.heure_fin);
  totalHeures.textContent = (dMin !== null && fMin !== null) ? "Total : " + formatDureeMinutes((fMin - dMin + 1440) % 1440) : "";
  blocHeures.appendChild(totalHeures);
  corps.appendChild(blocHeures);

  function creerInputEnteteFA(champ, libelle, type, onChangeExtra) {
    const wrap = document.createElement("div");
    const lab = document.createElement("label"); lab.textContent = libelle;
    const input = document.createElement("input");
    if (type === "number") { input.type = "text"; input.inputMode = "decimal"; }
    else input.type = type;
    input.value = feuille[champ] ?? "";
    input.addEventListener("change", async (e) => {
      const valeur = type === "number" ? (e.target.value || "").replace(",", ".") || null : (e.target.value || null);
      await supabase.from("feuilles_route").update({ [champ]: valeur }).eq("id", feuille.id);
      if (onChangeExtra) onChangeExtra();
    });
    wrap.appendChild(lab); wrap.appendChild(input);
    return { wrap, input };
  }

  blocsEnteteFA.forEach(bloc => {
    const wrapBloc = document.createElement("div");
    wrapBloc.className = "bloc-service-fa";
    wrapBloc.innerHTML = `<div class="sous-titre-fa">${bloc.titre}</div>`;
    const grille = document.createElement("div");
    grille.className = "grille3-fa";
    const totalDiv = document.createElement("div");
    totalDiv.className = "total-fa";

    const inputDebut = creerInputEnteteFA(bloc.debut, champsEnteteFA[bloc.debut][0], champsEnteteFA[bloc.debut][1], calculerTotalBloc);
    const inputFin = creerInputEnteteFA(bloc.fin, champsEnteteFA[bloc.fin][0], champsEnteteFA[bloc.fin][1], calculerTotalBloc);
    grille.appendChild(inputDebut.wrap);
    grille.appendChild(inputFin.wrap);

    function calculerTotalBloc() {
      const vd = parseFloat(String(inputDebut.input.value).replace(",", ".")), vf = parseFloat(String(inputFin.input.value).replace(",", "."));
      totalDiv.textContent = (!isNaN(vd) && !isNaN(vf)) ? "Total : " + (vf - vd).toFixed(2) : "";
    }
    calculerTotalBloc();

    wrapBloc.appendChild(grille);
    wrapBloc.appendChild(totalDiv);
    corps.appendChild(wrapBloc);
  });

  const titreCourses = document.createElement("div");
  titreCourses.className = "mini-titre"; titreCourses.textContent = "Courses";
  corps.appendChild(titreCourses);

  const conteneurLignes = document.createElement("div");
  lignes.forEach((ligne, index) => conteneurLignes.appendChild(construireLigneAdmin(ligne, index + 1)));
  corps.appendChild(conteneurLignes);

  const btnAjouter = document.createElement("button");
  btnAjouter.id = "btn-ajouter-ligne-admin";
  btnAjouter.textContent = "+ Ajouter une ligne manuelle";
  btnAjouter.addEventListener("click", async () => {
    const prochainNumero = lignes.length > 0 ? Math.max(...lignes.map(l => l.n_ordre || 0)) + 1 : 1;
    let indexDepartAuto = null;
    for (let i = lignes.length - 1; i >= 0; i--) {
      if (lignes[i].debarquement_index !== null && lignes[i].debarquement_index !== undefined) {
        indexDepartAuto = lignes[i].debarquement_index; break;
      }
    }
    await supabase.from("lignes_feuille_route").insert({ feuille_route_id: feuille.id, n_ordre: prochainNumero, index_depart: indexDepartAuto });
    feuillesDepliees.add(feuille.id);
    chargerFeuillesAdmin();
  });
  corps.appendChild(btnAjouter);
  div.appendChild(corps);

  return div;
}

function construireLigneAdmin(ligne, numeroAffiche) {
  const div = document.createElement("div");
  div.className = "ligne-admin";

  const statutCourse = ligne.courses?.statut;
  const labelStatutLigne = {
    en_attente: "en attente", prix_envoye: "prix envoyé", attente_acompte: "acompte à payer",
    acompte_declare: "paiement à vérifier", confirmee: "confirmée", assignee: "assignée",
    en_cours: "🚕 en cours", terminee: "✅ terminée", annulee: "❌ annulée"
  }[statutCourse];
  const estUberLigne = ligne.type_course === "uber" || ligne.mode_paiement === "uber";
  const modeAffiche = ligne.mode_paiement || ligne.courses?.mode_paiement;

  // Une course déjà terminée/annulée/clôturée reste fermée par défaut (sinon on doit tout
  // redéfiler à chaque ouverture de la feuille) ; une course encore active reste ouverte.
  // Le clic de l'admin garde toujours la priorité sur ce choix automatique.
  const ligneTermineeOuAnnulee = statutCourse === "terminee" || statutCourse === "annulee" || ligne.cloturee;
  const ligneOuverte = etatManuelLignesAdmin.has(ligne.id) ? etatManuelLignesAdmin.get(ligne.id) : !ligneTermineeOuAnnulee;

  const resume = [ligne.embarquement_lieu, ligne.debarquement_lieu].filter(Boolean).join(" → ") || "Détails non remplis";
  const heureResume = ligne.embarquement_heure ? " · " + String(ligne.embarquement_heure).slice(0, 5) : "";

  const entete = document.createElement("div");
  entete.className = "num-ligne";
  entete.innerHTML = `<span><b>Course n° ${numeroAffiche}</b> · ${esc(resume)}${esc(heureResume)}${ligne.course_id ? " · attribuée par la centrale" : " · manuelle"}${ligne.cloturee ? " · 🔒 clôturée par le chauffeur" : ""}${labelStatutLigne ? " · " + esc(labelStatutLigne) : ""}${estUberLigne ? " · 🚕 Uber" : (modeAffiche ? " · payé par " + esc(modeAffiche) : "")} <span class="chevron-ligne">${ligneOuverte ? "▴" : "▾"}</span></span>`;

  const btnSupprimer = document.createElement("button");
  btnSupprimer.textContent = "Supprimer";
  btnSupprimer.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (ligne.course_id) {
      if (!confirm("Cette ligne est liée à une vraie course. La supprimer supprimera définitivement la course elle-même. Continuer ?")) return;
      const { error } = await supabase.from("courses").delete().eq("id", ligne.course_id);
      if (error) { alert("Erreur : " + error.message); return; }
    } else {
      if (!confirm("Supprimer cette ligne de la feuille de route ?")) return;
      const { error } = await supabase.from("lignes_feuille_route").delete().eq("id", ligne.id);
      if (error) { alert("Erreur : " + error.message); return; }
    }
    chargerFeuillesAdmin();
  });
  entete.appendChild(btnSupprimer);
  div.appendChild(entete);

  const grille = document.createElement("div");
  grille.className = "grille3-fa";
  grille.style.display = ligneOuverte ? "grid" : "none";
  const wrapsParChampAdmin = {};
  const inputsParChampAdmin = {};
  champsLigneFA.forEach(([champ, libelle, type]) => {
    const estAdresse = champ === "embarquement_lieu" || champ === "debarquement_lieu";
    const estPaiement = champ === "mode_paiement";
    const estTypeCourse = champ === "type_course";
    const estCheckbox = type === "checkbox";
    const wrap = document.createElement("div");
    wrapsParChampAdmin[champ] = wrap;
    if (estAdresse) wrap.style.gridColumn = "1 / -1";
    const lab = document.createElement("label"); lab.textContent = libelle;
    const input = (estPaiement || estTypeCourse) ? document.createElement("select") : document.createElement("input");
    inputsParChampAdmin[champ] = input;
    if (estPaiement) {
      input.innerHTML = `
        <option value="">— Choisir —</option>
        <option value="cash">💶 Cash</option>
        <option value="carte">💳 Carte</option>
        <option value="facture">🧾 Facture</option>
        <option value="cheque_social">🎫 Chèque social/communal</option>
        <option value="uber">🚕 Uber (payé sur Uber)</option>
      `;
    } else if (estTypeCourse) {
      input.innerHTML = `
        <option value="normale">Course normale (taximètre)</option>
        <option value="forfait">Forfait</option>
        <option value="navette_aeroport">Navette aéroport</option>
        <option value="uber">🚕 Course Uber</option>
      `;
    } else if (estCheckbox) {
      input.type = "checkbox";
      input.style.cssText = "width:auto; margin-top:8px;";
    } else {
      if (type === "number") { input.type = "text"; input.inputMode = "decimal"; }
      else input.type = type;
    }
    if (estAdresse) input.style.cssText = "font-size:1rem; padding:12px; font-weight:600;";
    if (estCheckbox) input.checked = !!ligne[champ];
    else if (type === "time" && ligne[champ]) input.value = String(ligne[champ]).slice(0, 5);
    else input.value = ligne[champ] ?? (estTypeCourse ? "normale" : "");
    input.addEventListener("change", async (e) => {
      let valeur = estCheckbox ? e.target.checked : (e.target.value || null);
      if (type === "number" && typeof valeur === "string") valeur = valeur.replace(",", ".");
      const { data: ligneServeur, error } = await supabase
        .from("lignes_feuille_route").update({ [champ]: valeur }).eq("id", ligne.id).select("*").maybeSingle();
      if (error) { alert("Erreur : " + error.message); return; }
      if (ligneServeur) {
        Object.assign(ligne, ligneServeur);
        inputsParChampAdmin["type_course"].value = ligne.type_course || "normale";
        inputsParChampAdmin["mode_paiement"].value = ligne.mode_paiement || "";
        inputsParChampAdmin["prix_taximetre"].value = ligne.prix_taximetre ?? "";
        inputsParChampAdmin["sommes_percues"].value = ligne.sommes_percues ?? "";
      }
      if (estPaiement || estTypeCourse) appliquerVisibilitePaiementAdmin();
    });
    wrap.appendChild(lab); wrap.appendChild(input);
    grille.appendChild(wrap);
  });

  const mentionUber = document.createElement("div");
  mentionUber.className = "mention-uber";
  mentionUber.textContent = "🚕 Course Uber : rien à encaisser, le paiement arrive sur le compte Uber.";
  grille.insertBefore(mentionUber, wrapsParChampAdmin["mode_paiement"]);
  div.appendChild(grille);

  function appliquerVisibilitePaiementAdmin() {
    const mode = inputsParChampAdmin["mode_paiement"].value;
    const estUber = mode === "uber" || inputsParChampAdmin["type_course"].value === "uber";
    const estFacture = mode === "facture";
    wrapsParChampAdmin["prix_taximetre"].style.display = estUber ? "none" : "";
    wrapsParChampAdmin["sommes_percues"].style.display = (estFacture || estUber) ? "none" : "";
    wrapsParChampAdmin["numero_dossier"].style.display = estFacture ? "" : "none";
    mentionUber.style.display = estUber ? "" : "none";
  }
  appliquerVisibilitePaiementAdmin();

  entete.addEventListener("click", () => {
    const ouvert = grille.style.display !== "none";
    grille.style.display = ouvert ? "none" : "grid";
    entete.querySelector(".chevron-ligne").textContent = ouvert ? "▾" : "▴";
    etatManuelLignesAdmin.set(ligne.id, !ouvert);
    if (ouvert) lignesDepliees.delete(ligne.id); else lignesDepliees.add(ligne.id);
  });

  const btnFermerLigne = document.createElement("button");
  btnFermerLigne.textContent = "✕ Fermer";
  btnFermerLigne.style.cssText = "grid-column:1 / -1; margin:4px 8px; background:#dcdcda; color:var(--blanc); padding:8px; border-radius:8px; border:none; font-size:.8rem;";
  btnFermerLigne.addEventListener("click", () => {
    grille.style.display = "none";
    entete.querySelector(".chevron-ligne").textContent = "▾";
    etatManuelLignesAdmin.set(ligne.id, false);
    lignesDepliees.delete(ligne.id);
  });
  grille.appendChild(btnFermerLigne);

  return div;
}

function fmtNombre(v) {
  return (v === null || v === undefined || v === "") ? "" : esc(v);
}
function calcTotalBloc(debut, fin) {
  const d = parseFloat(debut), f = parseFloat(fin);
  return (!isNaN(d) && !isNaN(f)) ? (f - d).toFixed(2) : "";
}
function calcTotalHeures(debut, fin) {
  const dMin = minutesDepuisHeure(debut), fMin = minutesDepuisHeure(fin);
  return (dMin !== null && fMin !== null) ? formatDureeMinutes((fMin - dMin + 1440) % 1440) : "";
}

function construireVehiculeAdmin(vehicule) {
  const div = document.createElement("div");
  div.className = "vehicule-admin" + (vehicule.actif ? "" : " inactif");

  const champs = [
    ["nom", "Nom du véhicule", "text"],
    ["plaque", "Plaque d'immatriculation", "text"],
    ["numero_identification", "N° identification", "text"],
    ["places", "Nombre de places", "number"],
    ["identite_exploitant", "Société (feuille de route) — vide = Rasikh international", "text"]
  ];

  const grille = document.createElement("div");
  grille.className = "grille2-veh";
  champs.forEach(([champ, libelle, type]) => {
    const wrap = document.createElement("div");
    const lab = document.createElement("label"); lab.textContent = libelle;
    const input = document.createElement("input");
    input.type = type; input.value = vehicule[champ] ?? "";
    input.addEventListener("change", async (e) => {
      const val = type === "number" ? (e.target.value ? parseInt(e.target.value) : null) : (e.target.value || null);
      await supabase.from("vehicules").update({ [champ]: val }).eq("id", vehicule.id);
      chargerChauffeurs();
    });
    wrap.appendChild(lab); wrap.appendChild(input);
    grille.appendChild(wrap);
  });
  div.appendChild(grille);

  const wrapChauffeur = document.createElement("div");
  const labChauffeur = document.createElement("label"); labChauffeur.textContent = "Chauffeur attitré";
  const selectChauffeur = document.createElement("select");
  selectChauffeur.innerHTML = `<option value="">— Aucun —</option>` +
    chauffeursCache.map(c => `<option value="${c.id}" ${c.id === vehicule.chauffeur_id ? "selected" : ""}>${esc(c.nom || c.telephone)}</option>`).join("");
  selectChauffeur.addEventListener("change", async (e) => {
    await supabase.from("vehicules").update({ chauffeur_id: e.target.value || null }).eq("id", vehicule.id);
    await chargerChauffeurs();
    chargerVehiculesAdmin();
  });
  wrapChauffeur.appendChild(labChauffeur); wrapChauffeur.appendChild(selectChauffeur);
  div.appendChild(wrapChauffeur);

  const actions = document.createElement("div");
  actions.className = "ligne-actions-veh";

  const btnActif = document.createElement("button");
  btnActif.className = "btn-actif-veh" + (vehicule.actif ? " actif" : "");
  btnActif.textContent = vehicule.actif ? "✅ En service" : "⛔ Hors service";
  btnActif.addEventListener("click", async () => {
    await supabase.from("vehicules").update({ actif: !vehicule.actif }).eq("id", vehicule.id);
    await chargerChauffeurs();
    chargerVehiculesAdmin();
  });
  actions.appendChild(btnActif);

  const btnSupprimer = document.createElement("button");
  btnSupprimer.className = "btn-suppr-veh";
  btnSupprimer.textContent = "🗑️ Supprimer";
  btnSupprimer.addEventListener("click", async () => {
    if (!confirm(`Supprimer définitivement le véhicule "${vehicule.nom}" ?`)) return;
    const { error } = await supabase.from("vehicules").delete().eq("id", vehicule.id);
    if (error) { alert("Erreur : " + error.message); return; }
    await chargerChauffeurs();
    chargerVehiculesAdmin();
  });
  actions.appendChild(btnSupprimer);

  div.appendChild(actions);
  return div;
}

      <div style="font-weight:700; margin-bottom:6px;">💰 ${totalDu.toFixed(2)} € dus (${coursesNonPayees.length} course${coursesNonPayees.length > 1 ? "s" : ""})</div>
      ${coursesNonPayees.map(c => {
        const h = new Date(c.date_heure).toLocaleDateString("fr-BE", { day: "2-digit", month: "2-digit" });

      }).join("")}
      <button type="button" class="btn-marquer-commission-payee" style="margin-top:8px; width:100%; background:var(--vert); color:#fff; border:none; border-radius:8px; padding:10px; font-weight:600;">✅ Marquer ces commissions comme payées</button>
    `;
    blocFacturation.querySelector(".btn-marquer-commission-payee").addEventListener("click", async () => {
      if (!confirm(`Confirmer que ${partenaire.nom} a bien réglé ${totalDu.toFixed(2)} € ?`)) return;
      const ids = coursesNonPayees.map(c => c.id);

  const actions = document.createElement("div");

    await supabase.from("profils").update({ actif: !partenaire.actif }).eq("id", partenaire.id);
    await chargerChauffeurs();
    chargerPartenairesAdmin();
  });
  actions.appendChild(btnActif);

let carnetCache = [];

function trouverDansCarnet(nom, telephone) {
  const chiffres = chiffresTelephone(telephone);
  if (chiffres) {
    const parTel = carnetCache.find(c => chiffresTelephone(c.telephone) === chiffres);
    if (parTel) return parTel;
  }
  const nomNormalise = (nom || "").trim().toLowerCase();
  if (!nomNormalise) return null;
  return carnetCache.find(c => (c.nom || "").trim().toLowerCase() === nomNormalise) || null;
}

function creerBoutonCarnetPourClient({ nom, telephone, adresse, email }) {
  if (!(nom || "").trim() && !(telephone || "").trim()) return null;
  const existant = trouverDansCarnet(nom, telephone);
  const btn = document.createElement("button");
  btn.type = "button";
  btn.style.cssText = "width:100%; margin-top:8px; padding:10px; border-radius:8px; font-weight:600; font-size:.88rem; cursor:pointer;"
    + (existant
      ? "background:#fff; color:var(--vert); border:1px solid #bfe0cb;"
      : "background:#eaf5ee; color:var(--vert); border:1px solid var(--vert);");
  btn.textContent = existant ? `📇 Déjà dans le carnet — voir la fiche de ${existant.nom}` : "📇 Ajouter ce client au carnet";
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    allerAuCarnet();
    if (existant) {
      document.getElementById("recherche-carnet").value = existant.telephone || existant.nom;
      afficherCarnet();
    } else {
      ouvrirFormCarnet({ nom: nom || "", telephone: telephone || "", adresse: adresse || "", email: email || "" });
    }
  });
  return btn;
}

function allerAuCarnet() {
  document.querySelector('nav button[data-onglet="carnet"]').click();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function chiffresTelephone(tel) {
  let n = String(tel || "").replace(/\D/g, "");
  if (n.startsWith("0032")) n = n.slice(4);
  else if (n.startsWith("32") && n.length > 9) n = n.slice(2);
  else if (n.startsWith("0")) n = n.slice(1);
  return n;
}

function filtrerCarnet(texte) {
  const t = texte.trim().toLowerCase();
  if (!t) return carnetCache;
  const chiffres = chiffresTelephone(t);
  return carnetCache.filter(c => {
    const texteFiche = [c.nom, c.email, c.adresse, c.autre_adresse, c.notes].filter(Boolean).join(" ").toLowerCase();
    if (texteFiche.includes(t)) return true;
    return chiffres.length >= 3 && chiffresTelephone(c.telephone).includes(chiffres);
  });
}

async function chargerCarnet() {
  const { data, error } = await supabase
    .from("carnet_clients")
    .select("*")
    .order("nom", { ascending: true });
  if (error) {
    document.getElementById("liste-carnet").innerHTML = "Impossible de charger le carnet : " + esc(error.message);
    return;
  }
  carnetCache = data || [];
  invaliderCacheAdresses();
  afficherCarnet();
}

function afficherCarnet() {
  const conteneur = document.getElementById("liste-carnet");
  const recherche = document.getElementById("recherche-carnet").value;
  const resultats = filtrerCarnet(recherche);
  document.getElementById("compteur-carnet").textContent = carnetCache.length
    ? (recherche.trim() ? `${resultats.length} résultat(s) sur ${carnetCache.length} clients` : `${carnetCache.length} client(s) enregistré(s)`)
    : "";
  conteneur.innerHTML = "";
  if (carnetCache.length === 0) {
    conteneur.innerHTML = '<p style="color:var(--gris); text-align:center; padding:20px 0;">Le carnet est vide. Enregistre ton premier client avec le bouton vert, ou il s\'ajoutera tout seul à ta prochaine course.</p>';
    return;
  }
  if (resultats.length === 0) {
    conteneur.innerHTML = '<p style="color:var(--gris); text-align:center; padding:20px 0;">Aucun client ne correspond. Vérifie l\'orthographe ou cherche par numéro de téléphone.</p>';
    return;
  }
  resultats.forEach(c => conteneur.appendChild(construireFicheCarnet(c)));
}
document.getElementById("recherche-carnet").addEventListener("input", afficherCarnet);

function construireFicheCarnet(client) {
  const div = document.createElement("div");
  div.className = "fiche-carnet";
  div.innerHTML = `
    <div class="fc-nom">${esc(client.nom)}</div>
    ${client.telephone ? `<div class="fc-ligne">📞 <b>${esc(client.telephone)}</b></div>` : ""}
    ${client.email ? `<div class="fc-ligne">✉️ ${esc(client.email)}</div>` : ""}
    ${client.adresse ? `<div class="fc-ligne">📍 ${esc(client.adresse)}</div>` : ""}
    ${client.autre_adresse ? `<div class="fc-ligne">📍 Autre : ${esc(client.autre_adresse)}</div>` : ""}
    ${client.notes ? `<div class="fc-ligne">📝 ${esc(client.notes)}</div>` : ""}
    <div class="fc-actions">
      <button type="button" class="fc-course">🚕 Nouvelle course</button>
      ${client.telephone ? `<button type="button" class="fc-appel">📞 Appeler</button>` : ""}
      <button type="button" class="fc-modifier">✏️ Modifier</button>
      <button type="button" class="fc-suppr" title="Supprimer ce client">🗑️</button>
    </div>
  `;
  div.querySelector(".fc-course").addEventListener("click", () => ouvrirModaleCourse({ client }));
  const btnAppel = div.querySelector(".fc-appel");
  if (btnAppel) btnAppel.addEventListener("click", () => { window.location.href = `tel:${client.telephone.replace(/\s/g, "")}`; });
  div.querySelector(".fc-modifier").addEventListener("click", () => ouvrirFormCarnet(client));
  div.querySelector(".fc-suppr").addEventListener("click", async () => {
    if (!confirm(`Supprimer ${client.nom} du carnet ? Ses courses passées ne sont pas supprimées.`)) return;
    const { error } = await supabase.from("carnet_clients").delete().eq("id", client.id);
    if (error) { alert("Erreur : " + error.message); return; }
    chargerCarnet();
  });
  return div;
}

function ouvrirFormCarnet(client) {
  const form = document.getElementById("form-carnet");
  document.getElementById("titre-form-carnet").textContent = client?.id ? `Modifier ${client.nom}` : "Nouveau client";
  document.getElementById("carnet-id").value = client?.id || "";
  document.getElementById("carnet-nom").value = client?.nom || "";
  document.getElementById("carnet-telephone").value = client?.telephone || "";
  document.getElementById("carnet-email").value = client?.email || "";
  document.getElementById("carnet-adresse").value = client?.adresse || "";
  document.getElementById("carnet-autre-adresse").value = client?.autre_adresse || "";
  document.getElementById("carnet-notes").value = client?.notes || "";
  document.getElementById("erreur-carnet").textContent = "";
  form.style.display = "block";
  form.scrollIntoView({ behavior: "smooth", block: "start" });
  document.getElementById("carnet-nom").focus();
}
function fermerFormCarnet() { document.getElementById("form-carnet").style.display = "none"; }

document.getElementById("btn-nouveau-client-carnet").addEventListener("click", () => ouvrirFormCarnet(null));
document.getElementById("btn-annuler-carnet").addEventListener("click", fermerFormCarnet);
document.getElementById("btn-enregistrer-carnet").addEventListener("click", async () => {
  const erreur = document.getElementById("erreur-carnet");
  const id = document.getElementById("carnet-id").value;
  const fiche = {
    nom: document.getElementById("carnet-nom").value.trim(),
    telephone: document.getElementById("carnet-telephone").value.trim() || null,
    email: document.getElementById("carnet-email").value.trim() || null,
    adresse: document.getElementById("carnet-adresse").value.trim() || null,
    autre_adresse: document.getElementById("carnet-autre-adresse").value.trim() || null,
    notes: document.getElementById("carnet-notes").value.trim() || null
  };
  if (!fiche.nom) { erreur.textContent = "Le nom est obligatoire."; return; }
  if (!id && fiche.telephone) {
    const doublon = carnetCache.find(c => chiffresTelephone(c.telephone) && chiffresTelephone(c.telephone) === chiffresTelephone(fiche.telephone));
    if (doublon && !confirm(`${doublon.nom} a déjà ce numéro dans le carnet. Enregistrer quand même un nouveau client ?`)) return;
  }
  const { error } = id
    ? await supabase.from("carnet_clients").update(fiche).eq("id", id)
    : await supabase.from("carnet_clients").insert(fiche);
  if (error) { erreur.textContent = "Erreur : " + error.message; return; }
  fermerFormCarnet();
  await chargerCarnet();
  afficherListeCoursesAdmin();
});

async function enregistrerClientDepuisCourse({ nom, telephone, email, adresse }) {
  const chiffres = chiffresTelephone(telephone);
  const existant = carnetCache.find(c =>
    (chiffres && chiffresTelephone(c.telephone) === chiffres) ||
    (!chiffres && (c.nom || "").trim().toLowerCase() === nom.trim().toLowerCase())
  );
  if (existant) {
    const complement = {};
    if (!existant.telephone && telephone) complement.telephone = telephone;
    if (!existant.email && email) complement.email = email;
    if (!existant.adresse && adresse) complement.adresse = adresse;
    if (Object.keys(complement).length) await supabase.from("carnet_clients").update(complement).eq("id", existant.id);
  } else {
    await supabase.from("carnet_clients").insert({
      nom, telephone: telephone || null, email: email || null, adresse: adresse || null
    });
  }
  chargerCarnet();
}

let clientsCache = [];
async function chargerLeadsSite() {
  const conteneur = document.getElementById("bloc-leads-site");
  const { data: leads, error } = await supabase
    .from("leads_site")
    .select("*")
    .eq("traite", false)
    .order("created_at", { ascending: false });

  if (error || !leads || leads.length === 0) { conteneur.innerHTML = ""; return; }

  conteneur.innerHTML = `<h3 style="margin:0 0 8px;">📨 ${leads.length} demande${leads.length > 1 ? "s" : ""} reçue${leads.length > 1 ? "s" : ""} depuis le site web</h3>` +
    leads.map(l => `
      <div class="lead-site" data-id="${l.id}" data-tel="${esc(l.telephone || "")}">
        <div class="lead-site-titre">${esc(l.site_origine) || "Site web"} · ${new Date(l.created_at).toLocaleString("fr-BE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</div>
        <div class="lead-site-nom">${esc(l.nom) || "Nom non renseigné"}</div>
        <div class="lead-site-detail">${esc(l.telephone) || ""} ${l.email ? "· " + esc(l.email) : ""}</div>
        ${l.adresse_depart ? `<div class="lead-site-detail">${esc(l.adresse_depart)} → ${esc(l.adresse_arrivee) || "?"}</div>` : ""}
        ${l.date_heure ? `<div class="lead-site-detail">Souhaité : ${esc(l.date_heure)}</div>` : ""}
        ${l.message ? `<div class="lead-site-detail">"${esc(l.message)}"</div>` : ""}
        ${l.telephone ? `<button type="button" class="btn-appeler-lead">📞 Appeler</button>` : ""}
        <button type="button" class="btn-traite-lead">✅ Marquer traité</button>
      </div>
    `).join("");

  conteneur.querySelectorAll(".btn-appeler-lead").forEach(btn => {
    btn.addEventListener("click", () => {
      const tel = btn.closest(".lead-site").dataset.tel;
      window.location.href = `tel:${tel.replace(/\s/g, "")}`;
    });
  });
  conteneur.querySelectorAll(".btn-traite-lead").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.closest(".lead-site").dataset.id;
      await supabase.from("leads_site").update({ traite: true }).eq("id", id);
      chargerLeadsSite();
    });
  });
}

async function chargerClientsAdmin() {
  await chargerLeadsSite();
  const conteneur = document.getElementById("liste-clients-admin");
  conteneur.innerHTML = "Chargement…";

  const { data: clients, error } = await supabase
    .from("profils")
    .select("*")
    .eq("role", "client")
    .order("created_at", { ascending: false });

  if (error) { conteneur.innerHTML = "Erreur : " + esc(error.message); return; }

  const { data: toutesLesCourses } = await supabase
    .from("courses")
    .select("id, client_id, date_heure, adresse_depart, adresse_arrivee, prix, statut")
    .not("client_id", "is", null)
    .order("date_heure", { ascending: false });

  const coursesParClient = new Map();
  (toutesLesCourses || []).forEach(c => {
    if (!coursesParClient.has(c.client_id)) coursesParClient.set(c.client_id, []);
    coursesParClient.get(c.client_id).push(c);
  });

  clientsCache = (clients || []).map(cl => ({ ...cl, courses: coursesParClient.get(cl.id) || [] }));
  afficherClientsFiltres(document.getElementById("recherche-client").value.trim().toLowerCase());
}

function afficherClientsFiltres(recherche) {
  const conteneur = document.getElementById("liste-clients-admin");
  conteneur.innerHTML = "";

  const filtres = !recherche ? clientsCache : clientsCache.filter(c =>
    (c.nom || "").toLowerCase().includes(recherche) || (c.telephone || "").toLowerCase().includes(recherche)
  );

  if (filtres.length === 0) {
    conteneur.innerHTML = '<p style="color:var(--gris); text-align:center;">Aucun compte client trouvé.</p>';
    return;
  }
  filtres.forEach(cl => conteneur.appendChild(construireCarteClientAdmin(cl)));
}

document.getElementById("recherche-client").addEventListener("input", (e) => {
  afficherClientsFiltres(e.target.value.trim().toLowerCase());
});

function construireCarteClientAdmin(client) {
  const div = document.createElement("div");
  div.className = "client-admin";

  const coursesTerminees = client.courses.filter(c => c.statut === "terminee");
  const totalDepense = coursesTerminees.reduce((s, c) => s + (Number(c.prix) || 0), 0);
  const derniereCourse = client.courses[0];
  const derniereCourseTxt = derniereCourse
    ? new Date(derniereCourse.date_heure).toLocaleDateString("fr-BE", { day: "2-digit", month: "2-digit", year: "numeric" })
    : "—";

  div.innerHTML = `
    <div class="client-nom">${esc(client.nom) || "Client sans nom"}</div>
    <div class="client-coords">${esc(client.telephone) || "Pas de téléphone"}</div>
    <div class="client-stats">
      <div>Courses<b>${client.courses.length}</b></div>
      <div>Dépensé<b>${totalDepense.toFixed(2)} €</b></div>
      <div>Dernière course<b>${derniereCourseTxt}</b></div>
    </div>
    ${client.telephone ? `<button type="button" class="btn-appeler-client">📞 Appeler</button>` : ""}
    ${client.courses.length > 0 ? `<button type="button" class="btn-historique-client">📜 Historique complet</button>` : ""}
    <div class="historique-client-lignes" style="display:none;"></div>
  `;

  const btnAppel = div.querySelector(".btn-appeler-client");
  if (btnAppel) btnAppel.addEventListener("click", () => { window.location.href = `tel:${client.telephone.replace(/\s/g, "")}`; });

  const btnCarnetApp = creerBoutonCarnetPourClient({
    nom: client.nom, telephone: client.telephone,
    adresse: client.courses.find(c => c.adresse_depart)?.adresse_depart || ""
  });
  if (btnCarnetApp) div.appendChild(btnCarnetApp);

  const btnHisto = div.querySelector(".btn-historique-client");
  if (btnHisto) {
    const blocHisto = div.querySelector(".historique-client-lignes");
    btnHisto.addEventListener("click", () => {
      if (blocHisto.style.display === "none") {
        blocHisto.innerHTML = client.courses.map(c => {
          const d = new Date(c.date_heure).toLocaleDateString("fr-BE", { day: "2-digit", month: "2-digit", year: "numeric" });
          return `<div class="ligne-histo">${d} — ${esc(c.adresse_depart)} → ${esc(c.adresse_arrivee)} — ${c.prix ? esc(c.prix) + " €" : "?"} (${esc(c.statut)})</div>`;
        }).join("");
        blocHisto.style.display = "block";
        btnHisto.textContent = "📜 Masquer l'historique";
      } else {
        blocHisto.style.display = "none";
        btnHisto.textContent = "📜 Historique complet";
      }
    });
  }

  return div;
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(e => console.error("Service worker :", e));
}

  evenementInstallation.prompt();
  await evenementInstallation.userChoice;
  evenementInstallation = null;
  document.getElementById("btn-installer-app").style.display = "none";
});
