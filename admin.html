        <button class="btn-verrou">${feuille.verrouillee ? "🔓 Déverrouiller" : "🔒 Verrouiller"}</button>
      </div>
    </div>
  `;
  entete.querySelector(".btn-verrou").addEventListener("click", async () => {
    const nouvelEtat = !feuille.verrouillee;
    await supabase.from("feuilles_route").update({ verrouillee: nouvelEtat, signee: nouvelEtat }).eq("id", feuille.id);
    chargerFeuillesAdmin();
  });
  // Accès total : créer directement une vraie course pour ce chauffeur, à cette date, depuis la feuille
  entete.querySelector(".btn-nouvelle-course-fa").addEventListener("click", () => {
    document.getElementById("input-chauffeur").value = chauffeur.id;
    document.getElementById("input-date").value = dateChoisie + "T09:00";
    modale.classList.add("visible");
  });
  entete.querySelector(".btn-imprimer-fa").addEventListener("click", () => {
    imprimerFeuilleDeRoute(feuille, lignes, chauffeur, dateChoisie);
  });
  div.appendChild(entete);

  // Le détail complet est replié par défaut une fois la feuille signée (ça évite une liste
  // interminable à l'écran) — l'admin clique sur le nom du chauffeur pour l'ouvrir/refermer.
  const corps = document.createElement("div");
  const ouvertParDefaut = feuillesDepliees.has(feuille.id) || !feuille.verrouillee;
  corps.style.display = ouvertParDefaut ? "block" : "none";
  entete.querySelector(".chevron-ligne").textContent = ouvertParDefaut ? "▴" : "▾";
  entete.querySelector(".btn-details-fa").textContent = ouvertParDefaut ? "▴ Masquer" : "▾ Détails";
  function toggleCorps() {
    const ouvert = corps.style.display !== "none";
    corps.style.display = ouvert ? "none" : "block";
    if (ouvert) feuillesDepliees.delete(feuille.id); else feuillesDepliees.add(feuille.id);
    entete.querySelector(".chevron-ligne").textContent = ouvert ? "▾" : "▴";
    entete.querySelector(".btn-details-fa").textContent = ouvert ? "▾ Détails" : "▴ Masquer";
  }
  entete.querySelector(".entete-fa-info").addEventListener("click", toggleCorps);
  entete.querySelector(".btn-details-fa").addEventListener("click", (e) => { e.stopPropagation(); toggleCorps(); });

  // Heures des prestations (Début / Fin / Interruptions / Total, comme le modèle papier)
  const blocHeures = document.createElement("div");
  blocHeures.className = "bloc-service-fa";
  blocHeures.innerHTML = `<div class="sous-titre-fa">Heures des prestations</div>`;
  const grilleHeures = document.createElement("div");
  grilleHeures.className = "grille3-fa";
  [["heure_debut", "Début", "time"], ["heure_fin", "Fin", "time"], ["interruptions", "Interruptions", "text"]].forEach(([champ, libelle, type]) => {
    const wrap = document.createElement("div");
    const lab = document.createElement("label"); lab.textContent = libelle;
    const input = document.createElement("input");
    input.type = type;
    input.value = feuille[champ] ?? "";
    input.dataset.champHeure = champ;
    input.addEventListener("change", async (e) => {
      await supabase.from("feuilles_route").update({ [champ]: e.target.value || null }).eq("id", feuille.id);
      const debutMin = minutesDepuisHeure(grilleHeures.querySelector('[data-champ-heure="heure_debut"]').value);
      const finMin = minutesDepuisHeure(grilleHeures.querySelector('[data-champ-heure="heure_fin"]').value);
      const total = (debutMin !== null && finMin !== null) ? formatDureeMinutes((finMin - debutMin + 1440) % 1440) : "";
      totalHeures.textContent = total ? "Total : " + total : "";
    });
    wrap.appendChild(lab); wrap.appendChild(input);
    grilleHeures.appendChild(wrap);
  });
  blocHeures.appendChild(grilleHeures);
  const totalHeures = document.createElement("div");
  totalHeures.className = "total-fa";
  const dMin = minutesDepuisHeure(feuille.heure_debut), fMin = minutesDepuisHeure(feuille.heure_fin);
  totalHeures.textContent = (dMin !== null && fMin !== null) ? "Total : " + formatDureeMinutes((fMin - dMin + 1440) % 1440) : "";
  blocHeures.appendChild(totalHeures);
  corps.appendChild(blocHeures);

  // Blocs Km tableau de bord / Taximètre / Prise en charge / Index Km / Km en charge / Chutes / Recettes
  // chacun avec Début, Fin et Total calculé (Fin - Début), comme sur le modèle papier
  blocsEnteteFA.forEach(bloc => {
    const wrapBloc = document.createElement("div");
    wrapBloc.className = "bloc-service-fa";
    wrapBloc.innerHTML = `<div class="sous-titre-fa">${bloc.titre}</div>`;
    const grille = document.createElement("div");
    grille.className = "grille3-fa";

    const inputDebut = creerInputEnteteFA(feuille, bloc.debut, champsEnteteFA[bloc.debut][0], champsEnteteFA[bloc.debut][1], majTotalBloc);
    const inputFin = creerInputEnteteFA(feuille, bloc.fin, champsEnteteFA[bloc.fin][0], champsEnteteFA[bloc.fin][1], majTotalBloc);
    grille.appendChild(inputDebut.wrap);
    grille.appendChild(inputFin.wrap);

    const totalDiv = document.createElement("div");
    totalDiv.className = "total-fa";
    function calculerTotalBloc() {
      const vd = parseFloat(inputDebut.input.value), vf = parseFloat(inputFin.input.value);
      if (!isNaN(vd) && !isNaN(vf)) totalDiv.textContent = "Total : " + (vf - vd).toFixed(2);
      else totalDiv.textContent = "";
    }
    function majTotalBloc() { calculerTotalBloc(); }
    calculerTotalBloc();

    wrapBloc.appendChild(grille);
    wrapBloc.appendChild(totalDiv);
    corps.appendChild(wrapBloc);
  });

  function creerInputEnteteFA(feuille, champ, libelle, type, onChangeExtra) {
    const wrap = document.createElement("div");
    const lab = document.createElement("label"); lab.textContent = libelle;
    const input = document.createElement("input");
    if (type === "number") { input.type = "text"; input.inputMode = "decimal"; }
    else input.type = type;
    input.value = feuille[champ] ?? "";
    input.addEventListener("change", async (e) => {
      const valeur = type === "number" ? (e.target.value || "").replace(",", ".") || null : (e.target.value || null);
      await supabase.from("feuilles_route").update({ [champ]: valeur }).eq("id", feuille.id);
      if (onChangeExtra) onChangeExtra();
    });
    wrap.appendChild(lab); wrap.appendChild(input);
    return { wrap, input };
  }

  const titreCourses = document.createElement("div");
  titreCourses.className = "mini-titre"; titreCourses.textContent = "Courses";
  corps.appendChild(titreCourses);

  const conteneurLignes = document.createElement("div");
  lignes.forEach((ligne, index) => conteneurLignes.appendChild(construireLigneAdmin(ligne, index + 1)));
  corps.appendChild(conteneurLignes);

  const btnAjouter = document.createElement("button");
  btnAjouter.id = "btn-ajouter-ligne-admin";
  btnAjouter.textContent = "+ Ajouter une ligne manuelle";
  btnAjouter.addEventListener("click", async () => {
    const prochainNumero = lignes.length > 0 ? Math.max(...lignes.map(l => l.n_ordre)) + 1 : 1;
    await supabase.from("lignes_feuille_route").insert({ feuille_route_id: feuille.id, n_ordre: prochainNumero });
    chargerFeuillesAdmin();
  });
  corps.appendChild(btnAjouter);
  div.appendChild(corps);

  return div;
}

function construireLigneAdmin(ligne, numeroAffiche) {
  const div = document.createElement("div");
  div.className = "ligne-admin";

  const statutCourse = ligne.courses?.statut;
  const labelStatutLigne = {
    en_attente: "en attente", prix_envoye: "prix envoyé", attente_acompte: "acompte à payer",
    acompte_declare: "paiement à vérifier", confirmee: "confirmée", assignee: "assignée",
    en_cours: "🚕 en cours", terminee: "✅ terminée", annulee: "❌ annulée"
  }[statutCourse];

  // Résumé affiché sur la ligne : lieu de départ → lieu d'arrivée + heure
  const resume = [ligne.embarquement_lieu, ligne.debarquement_lieu].filter(Boolean).join(" → ") || "Détails non remplis";
  const heureResume = ligne.embarquement_heure ? " · " + ligne.embarquement_heure : "";

  const entete = document.createElement("div");
  entete.className = "num-ligne";
  // Numéro toujours séquentiel (1, 2, 3, 4, 5…) selon la position affichée, pas selon n_ordre en base
  const ligneOuverte = lignesDepliees.has(ligne.id);
  entete.innerHTML = `<span><b>Course n° ${numeroAffiche}</b> · ${esc(resume)}${esc(heureResume)}${ligne.course_id ? " · attribuée par la centrale" : " · manuelle"}${ligne.cloturee ? " · 🔒 clôturée par le chauffeur" : ""}${labelStatutLigne ? " · " + esc(labelStatutLigne) : ""}${ligne.courses?.mode_paiement ? " · payé par " + esc(ligne.courses.mode_paiement) : ""} <span class="chevron-ligne">${ligneOuverte ? "▴" : "▾"}</span></span>`;

  // Accès total : si la ligne est liée à une vraie course, la supprimer supprime la course elle-même
  // (et donc la ligne, via le trigger côté base) ; sinon elle supprime juste la ligne manuelle
  const btnSupprimer = document.createElement("button");
  btnSupprimer.textContent = "Supprimer";
  btnSupprimer.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (ligne.course_id) {
      if (!confirm("Cette ligne est liée à une vraie course. La supprimer supprimera définitivement la course elle-même. Continuer ?")) return;
      const { error } = await supabase.from("courses").delete().eq("id", ligne.course_id);
      if (error) { alert("Erreur : " + error.message); return; }
    } else {
      if (!confirm("Supprimer cette ligne de la feuille de route ?")) return;
      const { error } = await supabase.from("lignes_feuille_route").delete().eq("id", ligne.id);
      if (error) { alert("Erreur : " + error.message); return; }
    }
    chargerFeuillesAdmin();
  });
  entete.appendChild(btnSupprimer);
  div.appendChild(entete);

  const grille = document.createElement("div");
  grille.className = "grille3-fa";
  // Repliée par défaut, mais reste ouverte si l'admin l'a ouverte manuellement — sinon le
  // rafraîchissement automatique la referme toute seule après quelques secondes.
  grille.style.display = ligneOuverte ? "grid" : "none";
  const wrapsParChampAdmin = {};
  champsLigneFA.forEach(([champ, libelle, type]) => {
    const estAdresse = champ === "embarquement_lieu" || champ === "debarquement_lieu";
    const estPaiement = champ === "mode_paiement";
    const estTypeCourse = champ === "type_course";
    const estCheckbox = type === "checkbox";
    const wrap = document.createElement("div");
    wrapsParChampAdmin[champ] = wrap;
    if (estAdresse) wrap.style.gridColumn = "1 / -1"; // pleine largeur, bien visible pour le contrôle
    const lab = document.createElement("label"); lab.textContent = libelle;
    const input = (estPaiement || estTypeCourse) ? document.createElement("select") : document.createElement("input");
    if (estPaiement) {
      input.innerHTML = `
        <option value="">— Choisir —</option>
        <option value="cash">💶 Cash</option>
        <option value="carte">💳 Carte</option>
        <option value="facture">🧾 Facture</option>
      `;
    } else if (estTypeCourse) {
      input.innerHTML = `
        <option value="normale">Course normale (taximètre)</option>
        <option value="forfait">Forfait</option>
        <option value="navette_aeroport">Navette aéroport</option>
      `;
    } else if (estCheckbox) {
      input.type = "checkbox";
      input.style.cssText = "width:auto; margin-top:8px;";
    } else {
      if (type === "number") { input.type = "text"; input.inputMode = "decimal"; }
      else input.type = type;
    }
    if (estAdresse) input.style.cssText = "font-size:1rem; padding:12px; font-weight:600;";
    if (estCheckbox) input.checked = !!ligne[champ];
    else input.value = ligne[champ] ?? (estTypeCourse ? "normale" : "");
    input.addEventListener("change", async (e) => {
      let valeur = estCheckbox ? e.target.checked : (e.target.value || null);
      if (type === "number" && typeof valeur === "string") valeur = valeur.replace(",", ".");
      await supabase.from("lignes_feuille_route").update({ [champ]: valeur }).eq("id", ligne.id);
      if (estPaiement) appliquerVisibilitePaiementAdmin();
    });
    wrap.appendChild(lab); wrap.appendChild(input);
    grille.appendChild(wrap);
  });
  div.appendChild(grille);

  // Facture (assurance) : pas de montant à saisir, mais un n° de dossier — sinon Sommes perçues normal
  function appliquerVisibilitePaiementAdmin() {
    const mode = wrapsParChampAdmin["mode_paiement"].querySelector("select").value;
    const estFacture = mode === "facture";
    wrapsParChampAdmin["sommes_percues"].style.display = estFacture ? "none" : "";
    wrapsParChampAdmin["numero_dossier"].style.display = estFacture ? "" : "none";
  }
  appliquerVisibilitePaiementAdmin();

  entete.addEventListener("click", () => {
    const ouvert = grille.style.display !== "none";
    grille.style.display = ouvert ? "none" : "grid";
    entete.querySelector(".chevron-ligne").textContent = ouvert ? "▾" : "▴";
    if (ouvert) lignesDepliees.delete(ligne.id); else lignesDepliees.add(ligne.id);
  });

  // Bouton "Fermer" explicite, en plus du clic sur l'en-tête
  const btnFermerLigne = document.createElement("button");
  btnFermerLigne.textContent = "✕ Fermer";
  btnFermerLigne.style.cssText = "grid-column:1 / -1; margin-top:4px; background:#dcdcda; color:var(--blanc); padding:8px; border-radius:8px; border:none; font-size:.8rem;";
  btnFermerLigne.addEventListener("click", () => {
    grille.style.display = "none";
    entete.querySelector(".chevron-ligne").textContent = "▾";
    lignesDepliees.delete(ligne.id);
  });
  grille.appendChild(btnFermerLigne);

  return div;
}

// ---------- IMPRESSION A4 — réplique exacte du modèle papier ----------
function fmtNombre(v) {
  return (v === null || v === undefined || v === "") ? "" : esc(v);
}
function calcTotalBloc(debut, fin) {
  const d = parseFloat(debut), f = parseFloat(fin);
  return (!isNaN(d) && !isNaN(f)) ? (f - d).toFixed(2) : "";
}
function calcTotalHeures(debut, fin) {
  const dMin = minutesDepuisHeure(debut), fMin = minutesDepuisHeure(fin);
  return (dMin !== null && fMin !== null) ? formatDureeMinutes((fMin - dMin + 1440) % 1440) : "";
}

function imprimerFeuilleDeRoute(feuille, lignes, chauffeur, dateChoisie) {
  const dateLisible = new Date(dateChoisie + "T12:00:00").toLocaleDateString("fr-BE");
  const vehicule = feuille.vehicules;
  const identiteFeuille = vehicule?.identite_exploitant || IDENTITE_EXPLOITANT;

  // Une ligne par course, avec la mention "aller-retour" quand c'est le cas — pagine automatiquement
  // sur plusieurs pages A4 grâce à <thead> (répété en haut de chaque page imprimée) et aux règles
  // "évite de couper une ligne entre deux pages" ci-dessous : pas besoin de tout faire défiler d'un coup.
  const lignesHtml = (lignes.length ? lignes : new Array(8).fill(null)).map((l, i) => {
    l = l || {};
    const mentionAR = l.aller_retour ? ' <span style="color:#8a4a00; font-weight:bold;">(A/R)</span>' : "";
    return `<tr>
      <td>${i + 1}</td>
      <td>${fmtNombre(l.index_depart)}</td>
      <td>${fmtNombre(l.embarquement_index)}</td>
      <td>${fmtNombre(l.embarquement_lieu)}${mentionAR}</td>
      <td>${fmtNombre(l.embarquement_heure)}</td>
      <td>${fmtNombre(l.debarquement_index)}</td>
      <td>${fmtNombre(l.debarquement_lieu)}</td>
      <td>${fmtNombre(l.debarquement_heure)}</td>
      <td>${fmtNombre(l.prix_taximetre)}</td>
      <td>${fmtNombre(l.sommes_percues)}</td>
    </tr>`;
  }).join("");

  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
  <title>Feuille de route — ${esc(chauffeur.nom) || ""} — ${esc(dateLisible)}</title>
  <style>
    @page { size: A4; margin: 10mm; }
    * { box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; color: #000; font-size: 11px; margin: 0; }
    h1 { text-align: center; text-decoration: underline; font-size: 18px; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
    td, th { border: 1px solid #000; padding: 4px 6px; }
    .case-id { padding: 8px; margin-bottom: 8px; }
    .case-id .ligne { display: flex; justify-content: space-between; }
    h2 { font-size: 12px; text-align: center; margin: 8px 0 4px; border-top: 1px solid #000; border-bottom: 1px solid #000; padding: 3px 0; }
    .mini { font-size: 9px; color: #444; text-transform: uppercase; }
    .valeur { font-weight: bold; }
    .courses-table thead { display: table-header-group; } /* répète l'en-tête du tableau sur chaque page imprimée */
    .courses-table th { font-size: 9px; }
    .courses-table td { font-size: 10px; text-align: center; height: 22px; }
    .courses-table tr { page-break-inside: avoid; } /* jamais de ligne coupée entre deux pages */
    .signature { margin-top: 16px; }
    .note-bas { font-size: 8px; margin-top: 4px; }
    .barre-actions-impression { display: flex; gap: 8px; margin-bottom: 10px; }
    .barre-actions-impression button {
      padding: 8px 14px; border-radius: 6px; border: 1px solid #999; background: #f2f2f2;
      color: #000; font-family: -apple-system, sans-serif; font-size: 13px; cursor: pointer;
    }
    .barre-actions-impression button.btn-imprimer-action { background: #c81e2c; color: #fff; border-color: #c81e2c; }
    @media print { .btn-print, .barre-actions-impression { display: none; } }
  </style></head>
  <body>
    <div class="barre-actions-impression">
      <button onclick="window.close()">← Retour</button>
      <button class="btn-imprimer-action" onclick="window.print()">🖨️ Imprimer</button>
    </div>
    <h1>FEUILLE DE ROUTE</h1>
    <table>
      <tr><td style="width:35%"><span class="mini">Identité de l'exploitant</span></td>
          <td colspan="3" class="valeur">${esc(identiteFeuille)}</td></tr>
      <tr><td><span class="mini">Date</span> <span class="valeur">${esc(dateLisible)}</span></td>
          <td colspan="3"><span class="mini">Nom du chauffeur</span> <span class="valeur">${esc(chauffeur.nom) || ""}</span></td></tr>
      <tr><td><span class="mini">N° plaque d'immatriculation</span><br><span class="valeur">${esc(vehicule?.plaque) || "—"}</span></td>
          <td><span class="mini">Véhicule</span><br><span class="valeur">${esc(vehicule?.nom) || "—"}</span></td>
          <td colspan="2"><span class="mini">N° identification</span><br><span class="valeur">${esc(vehicule?.numero_identification) || "—"}</span></td></tr>
    </table>

    <h2>Service</h2>
    <table>
      <tr><th></th><th>Heures des prestations</th><th></th><th>Index km</th><th>Tableau de bord</th><th>Taximètre</th></tr>
      <tr><td>Début</td><td>${fmtNombre(feuille.heure_debut)}</td><td>Interruptions : ${fmtNombre(feuille.interruptions)}</td>
          <td>Fin</td><td>${fmtNombre(feuille.index_km_fin)}</td><td>${fmtNombre(feuille.taximetre_fin)}</td></tr>
      <tr><td>Fin</td><td>${fmtNombre(feuille.heure_fin)}</td><td></td>
          <td>Début</td><td>${fmtNombre(feuille.index_km_debut)}</td><td>${fmtNombre(feuille.taximetre_debut)}</td></tr>
      <tr><td>Total</td><td>${calcTotalHeures(feuille.heure_debut, feuille.heure_fin)}</td><td></td>
          <td>Total</td><td>${calcTotalBloc(feuille.index_km_debut, feuille.index_km_fin)}</td><td>${calcTotalBloc(feuille.taximetre_debut, feuille.taximetre_fin)}</td></tr>
    </table>

    <table>
      <tr><th></th><th>Prise en charge</th><th>Index Km (Km totaux)</th><th>Km en charge</th><th>Chutes (€)</th><th>Recettes</th></tr>
      <tr><td>Fin</td><td>${fmtNombre(feuille.prise_en_charge_fin)}</td><td>${fmtNombre(feuille.index_km_totaux_fin)}</td><td>${fmtNombre(feuille.km_en_charge_fin)}</td><td>${fmtNombre(feuille.chutes_fin)}</td><td>${fmtNombre(feuille.recettes_fin)}</td></tr>
      <tr><td>Début</td><td>${fmtNombre(feuille.prise_en_charge_debut)}</td><td>${fmtNombre(feuille.index_km_totaux_debut)}</td><td>${fmtNombre(feuille.km_en_charge_debut)}</td><td>${fmtNombre(feuille.chutes_debut)}</td><td>${fmtNombre(feuille.recettes_debut)}</td></tr>
      <tr><td>Total</td><td>${calcTotalBloc(feuille.prise_en_charge_debut, feuille.prise_en_charge_fin)}</td><td>${calcTotalBloc(feuille.index_km_totaux_debut, feuille.index_km_totaux_fin)}</td><td>${calcTotalBloc(feuille.km_en_charge_debut, feuille.km_en_charge_fin)}</td><td>${calcTotalBloc(feuille.chutes_debut, feuille.chutes_fin)}</td><td>${calcTotalBloc(feuille.recettes_debut, feuille.recettes_fin)}</td></tr>
    </table>

    <h2>Courses</h2>
    <table class="courses-table">
      <thead>
      <tr>
        <th rowspan="2">N° ordre</th><th rowspan="2">Index départ</th>
        <th colspan="3">Embarquement</th><th colspan="3">Débarquement</th>
        <th rowspan="2">Prix taximètre</th><th rowspan="2">Sommes perçues</th>
      </tr>
      <tr><th>Index</th><th>Lieu</th><th>Heure</th><th>Index</th><th>Lieu</th><th>Heure</th></tr>
      </thead>
      <tbody>
      ${lignesHtml}
      </tbody>
    </table>

    <div class="signature">Signature du chauffeur : ______________________________</div>
    <div class="note-bas">* Après déduction d'une remise commerciale éventuelle. (A/R) = course aller-retour.</div>
  </body></html>`;

  const fenetre = window.open("", "_blank");
  if (!fenetre) { alert("Le navigateur a bloqué l'ouverture de la fenêtre d'impression. Autorise les pop-ups pour ce site."); return; }
  fenetre.document.write(html);
  fenetre.document.close();
}

// ---------- VÉHICULES (admin) ----------
async function chargerVehiculesAdmin() {
  const conteneur = document.getElementById("liste-vehicules-admin");
  conteneur.innerHTML = "Chargement…";

  const { data: vehicules, error } = await supabase
    .from("vehicules")
    .select("*")
    .order("created_at", { ascending: true });

  if (error) { conteneur.innerHTML = "Erreur : " + error.message; return; }

  conteneur.innerHTML = "";
  if (!vehicules || vehicules.length === 0) {
    conteneur.innerHTML = '<p style="color:var(--gris); text-align:center;">Aucun véhicule enregistré.</p>';
    return;
  }
  vehicules.forEach(v => conteneur.appendChild(construireVehiculeAdmin(v)));
}

function construireVehiculeAdmin(vehicule) {
  const div = document.createElement("div");
  div.className = "vehicule-admin" + (vehicule.actif ? "" : " inactif");

  const champs = [
    ["nom", "Nom du véhicule", "text"],
    ["plaque", "Plaque d'immatriculation", "text"],
    ["numero_identification", "N° identification", "text"],
    ["places", "Nombre de places", "number"],
    ["identite_exploitant", "Société (feuille de route) — vide = Rasikh international", "text"]
  ];

  const grille = document.createElement("div");
  grille.className = "grille2-veh";
  champs.forEach(([champ, libelle, type]) => {
    const wrap = document.createElement("div");
    const lab = document.createElement("label"); lab.textContent = libelle;
    const input = document.createElement("input");
    input.type = type; input.value = vehicule[champ] ?? "";
    input.addEventListener("change", async (e) => {
      const val = type === "number" ? (e.target.value ? parseInt(e.target.value) : null) : (e.target.value || null);
      await supabase.from("vehicules").update({ [champ]: val }).eq("id", vehicule.id);
    });
    wrap.appendChild(lab); wrap.appendChild(input);
    grille.appendChild(wrap);
  });
  div.appendChild(grille);

  const wrapChauffeur = document.createElement("div");
  const labChauffeur = document.createElement("label"); labChauffeur.textContent = "Chauffeur assigné";
  const selectChauffeur = document.createElement("select");
  selectChauffeur.innerHTML = `<option value="">— Aucun —</option>` +
    chauffeursCache.map(c => `<option value="${c.id}" ${c.id === vehicule.chauffeur_id ? "selected" : ""}>${c.nom || c.telephone}</option>`).join("");
  selectChauffeur.addEventListener("change", async (e) => {
    await supabase.from("vehicules").update({ chauffeur_id: e.target.value || null }).eq("id", vehicule.id);
    chargerVehiculesAdmin();
  });
  wrapChauffeur.appendChild(labChauffeur); wrapChauffeur.appendChild(selectChauffeur);
  div.appendChild(wrapChauffeur);

  const actions = document.createElement("div");
  actions.className = "ligne-actions-veh";

  const btnActif = document.createElement("button");
  btnActif.className = "btn-actif-veh" + (vehicule.actif ? " actif" : "");
  btnActif.textContent = vehicule.actif ? "✅ En service" : "⛔ Hors service";
  btnActif.addEventListener("click", async () => {
    await supabase.from("vehicules").update({ actif: !vehicule.actif }).eq("id", vehicule.id);
    chargerVehiculesAdmin();
  });
  actions.appendChild(btnActif);

  const btnSupprimer = document.createElement("button");
  btnSupprimer.className = "btn-suppr-veh";
  btnSupprimer.textContent = "🗑️ Supprimer";
  btnSupprimer.addEventListener("click", async () => {
    if (!confirm(`Supprimer définitivement le véhicule "${vehicule.nom}" ?`)) return;
    const { error } = await supabase.from("vehicules").delete().eq("id", vehicule.id);
    if (error) { alert("Erreur : " + error.message); return; }
    chargerVehiculesAdmin();
  });
  actions.appendChild(btnSupprimer);

  div.appendChild(actions);
  return div;
}

document.getElementById("btn-ajouter-vehicule").addEventListener("click", async () => {
  const nom = prompt("Nom du véhicule (ex: Toyota Corolla) :");
  if (!nom) return;
  const { error } = await supabase.from("vehicules").insert({ nom, places: 4, actif: true });
  if (error) { alert("Erreur : " + error.message); return; }
  chargerVehiculesAdmin();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(e => console.error("Service worker :", e));
}

let evenementInstallation = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  evenementInstallation = e;
  document.getElementById("btn-installer-app").style.display = "block";
});
document.getElementById("btn-installer-app").addEventListener("click", async () => {
  if (!evenementInstallation) return;
  evenementInstallation.prompt();
  await evenementInstallation.userChoice;
  evenementInstallation = null;
  document.getElementById("btn-installer-app").style.display = "none";
});
