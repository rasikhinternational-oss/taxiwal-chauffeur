<script>
window.onerror = function(msg, url, line, col, err) {
  document.documentElement.insertAdjacentHTML("afterbegin",
    '<div style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#c81e2c;color:#fff;' +
    'padding:14px;font-size:12px;word-break:break-word;font-family:monospace;">' +

<style>
  :root{
    --noir:#f7f7f5;
    --noir-2:#ffffff;
    --rouge:#c81e2c;
    --vert:#1f8a4c;
    --gris:#6b6b6b;
    --blanc:#1c1c1c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(rgba(255,255,255,.90), rgba(255,255,255,.94)),
      url('fond-flotte.jpg') center/cover no-repeat fixed;
    color:var(--blanc);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:calc(20px + env(safe-area-inset-top)) 20px 16px;
    border-bottom:1px solid #dcdcda;
    position:sticky; top:0; background:rgba(255,255,255,.85); backdrop-filter:blur(6px); z-index:5;
  }
  header h1{ margin:0; font-size:1.1rem; font-weight:600; }
  header p{ margin:4px 0 0; color:var(--gris); font-size:.85rem; }
  @keyframes logo-pulse{
    0%,100%{ transform:scale(1); filter:drop-shadow(0 0 0 rgba(200,30,44,0)); }
    50%{ transform:scale(1.06); filter:drop-shadow(0 0 10px rgba(200,30,44,.55)); }
  }
  header img{ animation:logo-pulse 3.5s ease-in-out infinite; }

  #ecran-login{ padding:40px 20px; max-width:360px; margin:0 auto; }
  #ecran-login label{ display:block; font-size:.85rem; color:var(--gris); margin-bottom:6px; }
  #ecran-login input{
    width:100%; padding:14px; margin-bottom:14px; border-radius:10px;
    border:1px solid #cfcfcd; background:var(--noir-2); color:var(--blanc); font-size:1rem;
  }
  button{
    width:100%; padding:14px; border-radius:10px; border:none;
    background:var(--rouge); color:#fff; font-size:1rem; font-weight:600;
    cursor:pointer;
  }
  button.secondaire{ background:var(--noir-2); border:1px solid #cfcfcd; margin-top:10px; }
  #erreur-login{ color:var(--rouge); font-size:.85rem; margin-top:8px; min-height:1em; }

  #barre-dispo{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; background:var(--noir-2); margin:16px 20px; border-radius:12px;
  }
  #barre-dispo span{ font-size:.9rem; }
  #bloc-gains-jour{ display:flex; justify-content:space-between; background:var(--noir-2); border-radius:10px; padding:12px 16px; margin:0 20px 14px; font-size:.85rem; }
  #bloc-gains-jour b{ color:var(--vert); }
  .switch{
    width:48px; height:28px; background:#cfcfcd; border-radius:14px; position:relative; cursor:pointer;
  }
  .switch.actif{ background:var(--vert); }
  .switch::after{
    content:""; position:absolute; top:3px; left:3px; width:22px; height:22px;
    background:#fff; border-radius:50%; transition:transform .2s;
  }
  .switch.actif::after{ transform:translateX(20px); }

  #btn-feuille-route{
    display:block; width:calc(100% - 40px); margin:16px 20px 0; padding:14px;
    border-radius:10px; border:none; background:var(--vert); color:#fff; font-weight:600;
  }
  #liste-courses{ padding:0 20px; }

  /* Onglets */
  nav.onglets{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; padding:0 20px 14px; }
  nav.onglets button{ padding:16px 8px; border-radius:12px; border:1px solid #cfcfcd; background:var(--noir-2); color:var(--gris); font-size:.95rem; font-weight:600; cursor:pointer; }
  nav.onglets button.actif{ background:var(--rouge); color:#fff; border-color:var(--rouge); }
  section{ display:none; }
  section.visible{ display:block; }

  /* Agenda / calendrier */
  .calendrier{ background:var(--noir-2); border-radius:12px; padding:14px; margin:0 20px 16px; }
  .cal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .cal-header button{ width:auto; padding:6px 14px; background:var(--noir); border:1px solid #cfcfcd; border-radius:8px; color:var(--blanc); cursor:pointer; }
  .cal-header span{ font-weight:600; text-transform:capitalize; }
  .cal-grille{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-jour-nom{ font-size:.7rem; color:var(--gris); padding:4px 0; }
  .cal-jour{ position:relative; padding:9px 0; border-radius:8px; font-size:.85rem; cursor:pointer; background:var(--noir); }
  .cal-jour.hors-mois{ visibility:hidden; }
  .cal-jour.aujourdhui{ border:1px solid var(--vert); }
  .cal-jour.selectionne{ background:var(--rouge); color:#fff; }
  .cal-jour .point{ position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:var(--vert); }
  .cal-jour.selectionne .point{ background:#fff; }
  #agenda-jour-titre{ padding:0 20px 8px; color:var(--gris); font-size:.85rem; }
  #agenda-liste-jour{ padding:0 20px; }

  #modale-fr{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:50; align-items:flex-end; }
  #modale-fr.visible{ display:flex; }
  #modale-fr-contenu{ background:var(--noir-2); width:100%; border-radius:16px 16px 0 0; padding:20px; max-height:90vh; overflow-y:auto; }
  #modale-fr-contenu h2{ margin-top:0; font-size:1.1rem; }
  #modale-fr-contenu label{ display:block; font-size:.8rem; color:var(--gris); margin:10px 0 4px; }
  #modale-fr-contenu input, #modale-fr-contenu textarea{
    width:100%; padding:12px; border-radius:8px; border:1px solid #cfcfcd; background:var(--noir); color:var(--blanc); font-size:.95rem;
  }
  #modale-fr-contenu textarea{ resize:vertical; min-height:50px; }
  #avertissement-fr{ font-size:.8rem; color:var(--gris); margin-top:12px; background:#eef0ee; padding:10px; border-radius:8px; }
  #modale-fr-actions{ display:flex; gap:10px; margin-top:16px; }
  #modale-fr-actions button{ flex:1; padding:13px; border-radius:10px; border:none; font-weight:600; }
  #btn-annuler-fr{ background:#dcdcda; color:var(--blanc); }
  #btn-valider-fr{ background:var(--rouge); color:#fff; }
  #erreur-fr{ color:var(--rouge); font-size:.85rem; margin-top:8px; min-height:1em; }
  .course{
    background:var(--noir-2); border-radius:12px; padding:16px; margin-bottom:12px;
    border-left:4px solid var(--gris);
  }
  .course.assignee{ border-left-color:#3b82c4; }
  .course.en_cours{ border-left-color:var(--rouge); }
  .course.terminee{ border-left-color:var(--vert); opacity:.6; }
  .course h3{ margin:0 0 6px; font-size:1rem; }
  .course .heure{ color:var(--gris); font-size:.85rem; margin-bottom:10px; }
  .course .trajet{ font-size:.9rem; line-height:1.5; margin-bottom:10px; }
  .course .trajet b{ color:var(--blanc); }
  .course .statut-label{
    display:inline-block; font-size:.75rem; padding:3px 10px; border-radius:20px;
    background:#dcdcda; color:var(--gris); margin-bottom:10px;
  }
  .course-actions{ display:flex; gap:8px; }
  .course-actions button{ font-size:.9rem; padding:10px; }
  #vide{ text-align:center; color:var(--gris); padding:60px 20px; font-size:.95rem; }
</style>
</head>

<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script>
// =====================================================================
// CONFIGURATION — à compléter avec les identifiants du projet Supabase
// =====================================================================
const SUPABASE_URL = "https://dgtsgylgqucyzujvfkgo.supabase.co";
const SUPABASE_KEY = "sb_publishable_-UQH_c6pHVqDVqU1SySBUw_5LYDbfYp";
if (!window.supabase) {
  document.body.insertAdjacentHTML("afterbegin",
    '<div style="background:#c81e2c;color:#fff;padding:14px;text-align:center;font-weight:600;">' +
    'Problème de connexion internet — recharge la page.</div>');
  throw new Error("supabase-js non chargé (pas de connexion internet ?)");
}
// Stockage sécurisé : certains modes de navigation privée bloquent
// localStorage et font planter toute la page sans message. On bascule
// automatiquement sur un stockage temporaire en mémoire si besoin.
const stockageMemoire = {};
const stockageSecurise = {
  getItem: (cle) => { try { return window.localStorage.getItem(cle); } catch (e) { return stockageMemoire[cle] || null; } },
  setItem: (cle, valeur) => { try { window.localStorage.setItem(cle, valeur); } catch (e) { stockageMemoire[cle] = valeur; } },
  removeItem: (cle) => { try { window.localStorage.removeItem(cle); } catch (e) { delete stockageMemoire[cle]; } }
};

let supabase;
try {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      persistSession: true,      // garde la connexion même après fermeture de l'app
      autoRefreshToken: true,    // renouvelle automatiquement, sans redemander de code
      detectSessionInUrl: false,
      storage: stockageSecurise
    }
  });
} catch (e) {
  document.body.insertAdjacentHTML("afterbegin",
    '<div style="background:#c81e2c;color:#fff;padding:14px;text-align:center;font-weight:600;">' +
    'Erreur au démarrage : ' + e.message + '</div>');
}

let positionInterval = null;

// ---------- CONNEXION (OTP email, même principe que l'app Client) ----------
document.getElementById("btn-envoyer-code").addEventListener("click", async () => {
  const btn = document.getElementById("btn-envoyer-code");
  const email = document.getElementById("email").value.trim();
  const erreur = document.getElementById("erreur-login");
  erreur.textContent = "";
  if (!email) { erreur.textContent = "Entre ton adresse email."; return; }

  btn.disabled = true;
  const texteOriginal = btn.textContent;
  btn.textContent = "Envoi en cours…";

  try {
    const { error } = await supabase.auth.signInWithOtp({ email });
    if (error) { erreur.textContent = "Erreur : " + error.message; btn.disabled = false; btn.textContent = texteOriginal; return; }

    document.getElementById("bloc-otp").style.display = "block";
    btn.style.display = "none";
    document.getElementById("btn-valider-code").style.display = "block";
  } catch (e) {
    erreur.textContent = "Connexion impossible. Vérifie ta connexion internet et réessaie.";
    btn.disabled = false;
    btn.textContent = texteOriginal;
  }
});

document.getElementById("btn-valider-code").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const otp = document.getElementById("otp").value.trim();
  const erreur = document.getElementById("erreur-login");

  const { data, error } = await supabase.auth.verifyOtp({ email, token: otp, type: "email" });
  if (error) { erreur.textContent = "Code invalide."; return; }

  demarrerEspaceChauffeur();
});

// ---------- DÉMARRAGE ESPACE CHAUFFEUR ----------
async function demarrerEspaceChauffeur() {
  document.getElementById("ecran-login").style.display = "none";
  document.getElementById("ecran-principal").style.display = "block";
  document.getElementById("sous-titre").textContent = "Connecté";

  // Demande la permission d'afficher des notifications (une seule fois)
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }

  await chargerCourses(); // premier chargement : on note juste les courses existantes, sans sonner
  // Rafraîchit la liste toutes les 30 secondes (nouvelles courses assignées)
  setInterval(chargerCourses, 30000);
}

// ---------- SON + NOTIFICATION POUR NOUVELLE COURSE ----------
let idsCoursesConnues = null; // null = pas encore initialisé

function jouerSonAlerte() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(delai => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.3, ctx.currentTime + delai);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delai + 0.2);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + delai);
      osc.stop(ctx.currentTime + delai + 0.2);
    });
  } catch (e) { console.error("Son impossible :", e); }
}

function notifierNouvelleCourse(course) {
  jouerSonAlerte();
  if ("Notification" in window && Notification.permission === "granted") {
    new Notification("Nouvelle course Taxi Wal 🚕", {
      body: `${course.adresse_depart} → ${course.adresse_arrivee}`,
      tag: "course-" + course.id
    });
  }
}

// ---------- CHARGER LES COURSES DU CHAUFFEUR CONNECTÉ ----------
async function chargerCourses() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return;

  const { data: courses, error } = await supabase
    .from("courses")
    .select("*")
    .eq("chauffeur_id", user.id)
    .order("date_heure", { ascending: true });

  if (error) { console.error(error); return; }

  // Détecte les nouvelles courses (jamais vues) qui ne sont pas déjà terminées/annulées
  if (idsCoursesConnues === null) {
    idsCoursesConnues = new Set((courses || []).map(c => c.id));
  } else {
    (courses || []).forEach(c => {
      if (!idsCoursesConnues.has(c.id) && (c.statut === "assignee" || c.statut === "en_attente")) {
        notifierNouvelleCourse(c);
      }
      idsCoursesConnues.add(c.id);
    });
  }

  const conteneur = document.getElementById("liste-courses");
  const videMsg = document.getElementById("vide");
  conteneur.innerHTML = "";

  dernieresCoursesChauffeur = courses || [];
  rendreCalendrier(dernieresCoursesChauffeur);
  afficherCoursesDuJour(calJourSelectionne);

  if (!courses || courses.length === 0) {
    videMsg.style.display = "block";
    return;
  }
  videMsg.style.display = "none";

  courses.forEach(c => conteneur.appendChild(construireCarteCourse(c)));
}

// ---------- NAVIGATION PAR ONGLETS ----------
document.querySelectorAll("nav.onglets button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav.onglets button").forEach(b => b.classList.remove("actif"));
    btn.classList.add("actif");
    document.querySelectorAll("#ecran-principal section").forEach(s => s.classList.remove("visible"));
    document.getElementById("section-" + btn.dataset.onglet).classList.add("visible");
  });
});

// ---------- AGENDA / CALENDRIER ----------
let dernieresCoursesChauffeur = [];
let calMoisAffiche = new Date();
calMoisAffiche.setDate(1);
let calJourSelectionne = new Date().toISOString().slice(0, 10);

function joursAvecCourses(courses) {
  const map = {};
  (courses || []).forEach(c => {
    const jour = c.date_heure.slice(0, 10);
    map[jour] = (map[jour] || 0) + 1;
  });
  return map;
}

function rendreCalendrier(courses) {
  const grille = document.getElementById("cal-grille");
  const titre = document.getElementById("cal-titre");
  grille.innerHTML = "";

  ["L", "M", "M", "J", "V", "S", "D"].forEach(n => {
    const d = document.createElement("div");
    d.className = "cal-jour-nom";
    d.textContent = n;
    grille.appendChild(d);
  });

  const annee = calMoisAffiche.getFullYear(), mois = calMoisAffiche.getMonth();
  titre.textContent = calMoisAffiche.toLocaleDateString("fr-BE", { month: "long", year: "numeric" });

  const premierJourSemaine = (new Date(annee, mois, 1).getDay() + 6) % 7; // lundi = 0
  const nbJours = new Date(annee, mois + 1, 0).getDate();
  const map = joursAvecCourses(courses);
  const todayStr = new Date().toISOString().slice(0, 10);

  for (let i = 0; i < premierJourSemaine; i++) {
    const vide = document.createElement("div");
    vide.className = "cal-jour hors-mois";
    grille.appendChild(vide);
  }

  for (let jour = 1; jour <= nbJours; jour++) {
    const dateStr = `${annee}-${String(mois + 1).padStart(2, "0")}-${String(jour).padStart(2, "0")}`;
    const cell = document.createElement("div");
    cell.className = "cal-jour"
      + (dateStr === todayStr ? " aujourdhui" : "")
      + (dateStr === calJourSelectionne ? " selectionne" : "");
    cell.textContent = jour;
    if (map[dateStr]) {
      const point = document.createElement("div");
      point.className = "point";
      cell.appendChild(point);
    }
    cell.addEventListener("click", () => {
      calJourSelectionne = dateStr;
      rendreCalendrier(dernieresCoursesChauffeur);
      afficherCoursesDuJour(dateStr);
    });
    grille.appendChild(cell);
  }
}

function afficherCoursesDuJour(dateStr) {
  const titre = document.getElementById("agenda-jour-titre");
  const liste = document.getElementById("agenda-liste-jour");
  const dateLisible = new Date(dateStr + "T12:00:00").toLocaleDateString("fr-BE", {
    weekday: "long", day: "2-digit", month: "long"
  });
  titre.textContent = dateLisible;

  const coursesDuJour = dernieresCoursesChauffeur.filter(c => c.date_heure.slice(0, 10) === dateStr);
  liste.innerHTML = "";
  if (coursesDuJour.length === 0) {
    liste.innerHTML = '<div class="vide-agenda" style="text-align:center; color:var(--gris); padding:40px 20px; font-size:.95rem;">Aucune course ce jour-là.</div>';
    return;
  }
  coursesDuJour.forEach(c => liste.appendChild(construireCarteCourse(c)));
}

document.getElementById("cal-prev").addEventListener("click", () => {
  calMoisAffiche.setMonth(calMoisAffiche.getMonth() - 1);
  rendreCalendrier(dernieresCoursesChauffeur);
});
document.getElementById("cal-next").addEventListener("click", () => {
  calMoisAffiche.setMonth(calMoisAffiche.getMonth() + 1);
  rendreCalendrier(dernieresCoursesChauffeur);
});

function construireCarteCourse(course) {
  const div = document.createElement("div");
  div.className = "course " + course.statut;

  const heure = new Date(course.date_heure).toLocaleString("fr-BE", {
    weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
  });

  const labelStatut = {
    en_attente: "En attente", assignee: "Assignée",
    en_cours: "En cours", terminee: "Terminée", annulee: "Annulée"
  }[course.statut] || course.statut;

  div.innerHTML = `
    <span class="statut-label">${labelStatut}</span>
    <h3>${course.client_nom || "Client"}</h3>
    <div class="heure">${heure}</div>
    <div class="trajet">
      <b>Départ :</b> ${course.adresse_depart}<br>
      <b>Arrivée :</b> ${course.adresse_arrivee}<br>
      ${course.passagers ? `<b>Passagers :</b> ${course.passagers}` : ""}
      ${course.notes ? `<br><b>Note :</b> ${course.notes}` : ""}
    </div>
  `;

  const actions = document.createElement("div");
  actions.className = "course-actions";

  if (course.statut === "assignee" || course.statut === "en_cours") {
    const btnGps = creerBouton("🧭 Itinéraire GPS", () => {
      const dest = encodeURIComponent(course.adresse_arrivee);
      const dep = encodeURIComponent(course.adresse_depart);
      window.open(`https://www.google.com/maps/dir/?api=1&origin=${dep}&destination=${dest}&travelmode=driving`, "_blank");
    });
    btnGps.style.background = "#3b82c4";
    actions.appendChild(btnGps);

    if (course.client_telephone) {
      const btnAppel = creerBouton("📞 Appeler le client", () => {
        window.location.href = `tel:${course.client_telephone.replace(/\s/g, "")}`;
      });
      btnAppel.style.background = "#dcdcda";
      actions.appendChild(btnAppel);
    }
  }

  if (course.statut === "assignee") {
    actions.appendChild(creerBouton("Démarrer la course", () => changerStatut(course.id, "en_cours")));
  } else if (course.statut === "en_cours") {
    actions.appendChild(creerBouton("Marquer terminée", () => ouvrirModalePaiement(course.id)));
  }

  if (actions.children.length > 0) div.appendChild(actions);
  return div;
}

function creerBouton(texte, onClick) {
  const btn = document.createElement("button");
  btn.textContent = texte;
  btn.addEventListener("click", onClick);
  return btn;
}

async function changerStatut(courseId, nouveauStatut) {
  const { error } = await supabase
    .from("courses")
    .update({ statut: nouveauStatut })
    .eq("id", courseId);

  if (error) { alert("Impossible de modifier : " + error.message); return; }
  chargerCourses();
}

// ---------- MODE DE PAIEMENT (fin de course) ----------
let courseEnFinDePaiement = null;
const modalePaiement = document.getElementById("modale-paiement");

function ouvrirModalePaiement(courseId) {
  courseEnFinDePaiement = courseId;
  modalePaiement.style.display = "flex";
}
document.getElementById("btn-annuler-paiement").addEventListener("click", () => {
  modalePaiement.style.display = "none";
  courseEnFinDePaiement = null;
});
document.getElementById("btn-paiement-cash").addEventListener("click", () => terminerAvecPaiement("cash"));
document.getElementById("btn-paiement-carte").addEventListener("click", () => terminerAvecPaiement("carte"));

async function terminerAvecPaiement(mode) {
  if (!courseEnFinDePaiement) return;
  const { error } = await supabase
    .from("courses")
    .update({ statut: "terminee", mode_paiement: mode })
    .eq("id", courseEnFinDePaiement);

  modalePaiement.style.display = "none";
  courseEnFinDePaiement = null;

  if (error) { alert("Impossible de modifier : " + error.message); return; }
  chargerCourses();
}

// ---------- DISPONIBILITÉ + PARTAGE DE POSITION GPS ----------
const switchDispo = document.getElementById("switch-dispo");
let dispoActive = false;

switchDispo.addEventListener("click", () => {
  dispoActive = !dispoActive;
  switchDispo.classList.toggle("actif", dispoActive);

  if (dispoActive) {
    demarrerPartagePosition();
  } else {
    arreterPartagePosition();
  }
});

function demarrerPartagePosition() {
  if (!navigator.geolocation) { alert("La géolocalisation n'est pas disponible sur cet appareil."); return; }

  envoyerPosition(); // premier envoi immédiat
  positionInterval = setInterval(envoyerPosition, 30000); // toutes les 30s
}

function arreterPartagePosition() {
  if (positionInterval) clearInterval(positionInterval);
  metPositionIndisponible();
}

async function envoyerPosition() {
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return;

    await supabase.from("positions_chauffeurs").upsert({
      chauffeur_id: user.id,
      latitude: pos.coords.latitude,
      longitude: pos.coords.longitude,
      disponible: true,
      updated_at: new Date().toISOString()
    });
  }, (err) => console.error("Erreur GPS :", err));
}

async function metPositionIndisponible() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return;
  await supabase.from("positions_chauffeurs")
    .update({ disponible: false })
    .eq("chauffeur_id", user.id);
}

// ---------- INSTALLATION APP (Android / ordinateur) ----------
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(e => console.error("Service worker :", e));
}

let evenementInstallation = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  evenementInstallation = e;
  document.getElementById("btn-installer-app").style.display = "block";
});
document.getElementById("btn-installer-app").addEventListener("click", async () => {
  if (!evenementInstallation) return;
  evenementInstallation.prompt();
  await evenementInstallation.userChoice;
  evenementInstallation = null;
  document.getElementById("btn-installer-app").style.display = "none";
});

// ---------- RESTAURER LA SESSION SI DÉJÀ CONNECTÉ ----------
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) demarrerEspaceChauffeur();
})();
</script>
